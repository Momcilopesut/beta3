<title>Python Kitchen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Kalam:wght@700&display=swap">
<style>
/* Layout: a narrow left column (recipe = code, step controls, the two explanations) beside one large 2D kitchen drawing.
   The kitchen is a single SVG: tiled back wall with two shelves and a serving hatch, a stone countertop with cutting boards
   and a sink, cabinets below. Every drawn thing carries its Python name in blue underneath. */
:root {
  --bg: #e3e9e7; --panel: #ffffff; --ink: #1d2a2a; --muted: #5d6c6b; --line: #cdd9d6;
  --py: #2350c4;
  --hl-bg: #fff2b8; --hl-edge: #e0b414;
  --wall: #f4f6f2; --grout: #d9dfd9;
  --plank: #c99a62; --plank-dark: #8e6436;
  --stone: #c3c8c6; --stone-edge: #9ea5a3; --stone-fleck: #b3b9b7;
  --cab: #5f7f78; --cab-edge: #4a6660; --handle: #d6dcdc;
  --board: #e2bf8c; --board-edge: #a87a45; --board-ink: #3b2610;
  --glass: rgba(205, 228, 242, .55); --glass-edge: #86a7bf;
  --lid: #c4503b; --lid-dark: #93372a;
  --paper: #fffdf5; --paper-edge: #d8d2bf;
  --china: #ffffff; --china-edge: #b9c3c8;
  --tea: #a46d2a;
  --steel: #d3dade; --steel-dark: #8f9ca5; --basin: #a9b4bb;
  --opening: #3b3530; --opening-ink: #e9e1d4;
  --tape: #f1dfa8; --tape-ink: #3d3214;
  --twine: #8f5a1e;
  --sponge: #e8b66c; --cream: #f6d8e2;
  --flash: rgba(240, 196, 30, .55);
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --hand: "Kalam", "Segoe Print", "Comic Sans MS", cursive;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1615; --panel: #172120; --ink: #e4edeb; --muted: #98a9a7; --line: #2b3a38; --py: #8cb0ff;
  --hl-bg: #3b3313; --hl-edge: #f0c93c;
  --wall: #1f2826; --grout: #2a3533; --plank: #7d5a32; --plank-dark: #563c1f;
  --stone: #3a4140; --stone-edge: #2b3130; --stone-fleck: #444c4a; --cab: #2c3d3a; --cab-edge: #1f2c2a; --handle: #8c9998;
  --board: #8a6639; --board-edge: #5e4322; --board-ink: #fbeedb;
  --glass: rgba(140, 180, 210, .2); --glass-edge: #6488a3; --lid: #d4614b; --lid-dark: #9c3f2f;
  --paper: #f3eedf; --paper-edge: #b9b29c; --china: #e9eef0; --china-edge: #9aa6ad; --tea: #b67c35;
  --steel: #5c6970; --steel-dark: #3c474e; --basin: #2c353b; --opening: #0b0a09; --opening-ink: #d8d0c2;
  --tape: #dcc88f; --tape-ink: #2b2208; --twine: #e2ad66; --flash: rgba(240, 201, 60, .4); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0f1615; --panel: #172120; --ink: #e4edeb; --muted: #98a9a7; --line: #2b3a38; --py: #8cb0ff;
  --hl-bg: #3b3313; --hl-edge: #f0c93c;
  --wall: #1f2826; --grout: #2a3533; --plank: #7d5a32; --plank-dark: #563c1f;
  --stone: #3a4140; --stone-edge: #2b3130; --stone-fleck: #444c4a; --cab: #2c3d3a; --cab-edge: #1f2c2a; --handle: #8c9998;
  --board: #8a6639; --board-edge: #5e4322; --board-ink: #fbeedb;
  --glass: rgba(140, 180, 210, .2); --glass-edge: #6488a3; --lid: #d4614b; --lid-dark: #9c3f2f;
  --paper: #f3eedf; --paper-edge: #b9b29c; --china: #e9eef0; --china-edge: #9aa6ad; --tea: #b67c35;
  --steel: #5c6970; --steel-dark: #3c474e; --basin: #2c353b; --opening: #0b0a09; --opening-ink: #d8d0c2;

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--body); }
.wrap { max-width: 1440px; margin: 0 auto; padding-inline: 18px; padding-block: 24px 48px; display: grid; gap: 16px; }

.term { display: inline-flex; flex-direction: column; line-height: 1.15; vertical-align: middle; }
.term .tk { font-weight: 600; }
.term .tp { font: 500 11px/1.3 var(--mono); color: var(--py); }
ruby { ruby-position: under; }
rt { font: 500 10.5px var(--mono); color: var(--py); padding-top: 1px; }

header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; }
h1 { font: 800 clamp(28px, 4.4vw, 40px)/1.05 var(--display); margin: 0; }
.sub { margin: 0; color: var(--muted); max-width: 70ch; }

nav.lessons { display: flex; flex-wrap: wrap; gap: 8px; }
nav.lessons button { display: flex; align-items: center; gap: 10px; text-align: left; font: 500 14px/1.2 var(--body); color: var(--ink);
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px 8px 10px; cursor: pointer; }
nav.lessons .n { font: 600 12px var(--mono); width: 22px; height: 22px; display: grid; place-items: center; border-radius: 50%; background: var(--bg); }
nav.lessons button[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
nav.lessons button[aria-pressed="true"] .n { background: var(--ink); color: var(--bg); }

.stage { display: grid; grid-template-columns: minmax(290px, 340px) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 1000px) { .stage { grid-template-columns: minmax(0, 1fr); } .stage .scene-wrap { order: -1; } }
.col { display: grid; gap: 12px; min-width: 0; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; min-width: 0; }
.head .term .tk { font: 600 12px var(--body); text-transform: uppercase; letter-spacing: .1em; }
h2 { font: 600 20px/1.2 var(--display); margin: 8px 0 2px; text-wrap: balance; }
.blurb { margin: 0 0 10px; color: var(--muted); font-size: 14px; }

.recipe { background: var(--paper); color: #24221c; border: 1px solid var(--paper-edge); border-top: 4px solid var(--lid); border-radius: 4px; overflow-x: auto;
  background-image: repeating-linear-gradient(to bottom, transparent 0 27px, var(--paper-edge) 27px 28px); background-position: 0 8px; }
.recipe ol { list-style: none; margin: 0; padding: 8px 0; font: 13px/28px var(--mono); }
.recipe li { display: flex; white-space: pre; border-left: 4px solid transparent; padding-right: 12px; }
.recipe .ln { width: 32px; flex: none; text-align: right; padding-right: 10px; color: #7a7564; font-variant-numeric: tabular-nums; }
.recipe li.cur { background: #fff0a8; border-left-color: #e0b414; }
.recipe li.cur .ln { color: #24221c; font-weight: 600; }
.recipe .kw { color: #7b3fb5; font-weight: 600; } .recipe .st { color: #2c7a4b; } .recipe .nu { color: #b4521a; } .recipe .bi { color: #2350c4; }

.note { border-radius: 10px; padding: 12px 14px; min-width: 0; }
.note.k { background: var(--board); border: 1px solid var(--board-edge); color: var(--board-ink); }
.note.py { background: var(--panel); border: 1px solid var(--line); }
.note h3 { font: 600 11px/1 var(--body); text-transform: uppercase; letter-spacing: .12em; margin: 0 0 8px; opacity: .75; }
.note p { margin: 0; }
.note.k p { line-height: 2.3; }
.note.k rt { color: var(--board-ink); opacity: .85; font-weight: 600; }
.note code { font: 12.5px var(--mono); background: color-mix(in srgb, currentColor 11%, transparent); padding: 1px 5px; border-radius: 4px; }

.controls { display: grid; gap: 10px; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btns button { font: 500 14px/1 var(--body); padding: 10px 13px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
.btns button.primary { background: var(--ink); border-color: var(--ink); color: var(--bg); font-weight: 600; }
.btns button:disabled { opacity: .4; cursor: default; }
.count { margin-left: auto; font: 13px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
input[type=range] { width: 100%; accent-color: var(--ink); }
.hint { font-size: 12px; color: var(--muted); margin: 0; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--hl-edge); outline-offset: 2px; }

.scene-wrap { min-width: 0; overflow-x: auto; border-radius: 14px; border: 1px solid var(--line); background: var(--wall); }
#kitchen { display: block; width: 100%; min-width: 760px; height: auto; }

/* ---- SVG kitchen ---- */
#kitchen text { font-family: var(--body); }
.wall { fill: var(--wall); } .grout { stroke: var(--grout); stroke-width: 1.5; fill: none; }
.plank { fill: var(--plank); } .plank-dark { fill: var(--plank-dark); }
.stone { fill: var(--stone); } .stone-edge { fill: var(--stone-edge); } .fleck { fill: var(--stone-fleck); }
.cab { fill: var(--cab); } .cab-door { fill: none; stroke: var(--cab-edge); stroke-width: 3; } .handle { fill: var(--handle); }
.board { fill: var(--board); stroke: var(--board-edge); stroke-width: 2.5; } .hole { fill: var(--stone); stroke: var(--board-edge); stroke-width: 2; }
.board-grain { stroke: var(--board-edge); stroke-width: 1; opacity: .25; fill: none; }
.ring { fill: none; stroke: var(--hl-edge); stroke-width: 5; }
.waiting { opacity: .62; }
.glass { fill: var(--glass); stroke: var(--glass-edge); stroke-width: 2.5; }
.glass-shine { fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; opacity: .55; }
.lid { fill: var(--lid); } .lid-dark { fill: var(--lid-dark); }
.paper { fill: var(--paper); stroke: var(--paper-edge); stroke-width: 1.2; }
.china { fill: var(--china); stroke: var(--china-edge); stroke-width: 2; } .china-line { fill: none; stroke: var(--china-edge); stroke-width: 7; stroke-linecap: round; }
.tea { fill: var(--tea); } .steam { fill: none; stroke: var(--china-edge); stroke-width: 2; stroke-linecap: round; opacity: .7; }
.steel { fill: var(--steel); stroke: var(--steel-dark); stroke-width: 2; } .steel-dark { fill: var(--steel-dark); }
.basin { fill: var(--basin); stroke: var(--steel-dark); stroke-width: 4; } .drain { fill: var(--steel-dark); }
.wood { fill: var(--plank); stroke: var(--plank-dark); stroke-width: 3; } .drawer { fill: var(--board); stroke: var(--plank-dark); stroke-width: 1.5; }
.knob { fill: var(--plank-dark); }
.cube { fill: #fbfbf6; stroke: #bdbcae; stroke-width: 1; }
.opening { fill: var(--opening); } .frame { fill: var(--plank); stroke: var(--plank-dark); stroke-width: 2; }
.rail { stroke: var(--steel-dark); stroke-width: 3; }
.tape { fill: var(--tape); }
.knot { fill: var(--twine); stroke: var(--paper); stroke-width: 2; }
.twine { fill: none; stroke: var(--twine); stroke-width: 2.4; stroke-dasharray: 8 3; stroke-linecap: round; }
.twine.new { stroke-width: 3.6; }
.sponge { fill: var(--sponge); stroke: #a8743a; stroke-width: 1; } .creamy { fill: var(--cream); stroke: #c48a9c; stroke-width: 1; }
.hl { fill: var(--hl-bg); stroke: var(--hl-edge); stroke-width: 2; }
.flash { fill: var(--flash); animation: fade 1.4s ease-out forwards; }
@keyframes fade { from { opacity: 1; } to { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .flash { animation: none; opacity: 0; } }
.t-k { fill: var(--ink); font: 600 16px var(--body); }
.t-k-board { fill: var(--board-ink); font: 600 16px var(--body); }
.t-py { fill: var(--py); font: 500 13px var(--mono); }
.t-head { fill: var(--ink); font: 600 14px var(--body); letter-spacing: .12em; }
.t-muted { fill: var(--muted); font: italic 15px var(--body); }
.t-hand { fill: var(--tape-ink); font: 700 20px var(--hand); }
.t-val { fill: #24221c; font: 600 13px var(--mono); }
.t-tiny { fill: #7a7564; font: 600 10px var(--body); letter-spacing: .12em; }
.t-ticket { fill: #24221c; font: 500 13px var(--mono); }
.t-open { fill: var(--opening-ink); font: italic 15px var(--body); }
.t-recipe { fill: #24221c; font: 600 14px var(--mono); }
.emoji { font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; }
</style>

<div class="wrap">
  <header>
    <h1>Python Kitchen</h1>
    <p class="sub">Step through short programs and watch them cook. Every object in the kitchen has its Python name written underneath in blue.</p>
  </header>

  <nav class="lessons" id="lessons" aria-label="Lessons"></nav>

  <div class="stage">
    <div class="col">
      <section class="panel">
        <div class="head" id="recipe-head"></div>
        <h2 id="ltitle"></h2>
        <p class="blurb" id="lblurb"></p>
        <div class="recipe"><ol id="code"></ol></div>
      </section>
      <section class="panel controls">
        <div class="btns">
          <button id="b-prev" type="button">Back</button>
          <button id="b-next" type="button" class="primary">Next step</button>
          <button id="b-play" type="button">Play</button>
          <button id="b-first" type="button">Restart</button>
          <span class="count" id="count"></span>
        </div>
        <input type="range" id="scrub" min="0" value="0" aria-label="Jump to step">
        <p class="hint">Tip: use the ← and → keys to step.</p>
      </section>
      <section class="note k" aria-live="polite"><h3>In the kitchen</h3><p id="nk"></p></section>
      <section class="note py"><h3>In Python</h3><p id="npy"></p></section>
    </div>
    <div class="scene-wrap">
      <svg id="kitchen" viewBox="0 0 1200 780" role="img" aria-label="Illustrated kitchen showing the program's memory"></svg>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const term = (k, py) => `<span class="term"><span class="tk">${k}</span><span class="tp">${py}</span></span>`;
const fmt = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\[([^\]|]+)\|([^\]]+)\]/g, "<ruby>$1<rt>$2</rt></ruby>");

const INGREDIENT = { "'egg'": "🥚", "'flour'": "🌾", "'milk'": "🥛", "'salt'": "🧂", "'mint'": "🌿", "'pepper'": "🌶️" };
const P = (v, opt = {}) => ({ p: String(v), ...opt });
const R = id => ({ r: id });
const g = st => st.frames[0].vars;
const active = st => st.frames[st.frames.length - 1].vars;

const KIND = {
  int: ["Sealed jar", "int object"], str: ["Sealed jar", "str object"], list: ["Mixing bowl", "list object"],
  dict: ["Spice cabinet", "dict object"], func: ["Recipe card", "function object"],
};

function lesson(meta, script) {
  const steps = [];
  let st = { frames: [{ name: "global", vars: {} }], heap: {}, out: [] };
  const step = (line, k, py, fn) => {
    st = JSON.parse(JSON.stringify(st));
    if (fn) fn(st);
    steps.push({ line, k, py, st });
  };
  step(null, "A clean kitchen. The [shelves|memory] are empty and there's no [masking tape|variables] on the [main board|global frame] yet.",
    "Nothing has run. The global frame has no names and no objects exist.");
  script(step);
  return { ...meta, steps };
}

const LESSONS = [
  lesson({ id: "labels", title: "Labels and jars", topic: "variables",
    blurb: "A variable is a label tied to something on the shelf, not a box that holds it.",
    code: ['sugar = 5', 'backup = sugar', 'sugar = sugar + 1', 'print(sugar, backup)'] }, step => {
    step(1, "Fill a [jar|object] with 5 sugar cubes and seal it. Write `sugar` on [masking tape|a variable name] and tie it to the jar with [twine|a reference].",
      "`sugar = 5` creates an int object 5, then binds the name `sugar` to it.",
      st => { st.heap.o1 = { t: "int", v: "5", cubes: 5 }; g(st).sugar = R("o1"); });
    step(2, "Tie a second [label|name], `backup`, to the same [jar|object]. Still one jar of sugar, now with two labels.",
      "`backup = sugar` copies the reference, not the object. Both names refer to the same 5.",
      st => { g(st).backup = R("o1"); });
    step(3, "The jar is [sealed|immutable], so you can't drop in another cube. You fill a [new jar|new object] with 6 cubes and move the `sugar` [label|name] onto it. `backup` stays on the old jar.",
      "Ints are immutable. `sugar + 1` creates a new object 6 and `sugar` is rebound to it. `backup` still refers to 5.",
      st => { st.heap.o2 = { t: "int", v: "6", cubes: 6 }; g(st).sugar = R("o2"); });
    step(4, "Follow each [twine|reference] to its jar and send what you find out through the [serving hatch|output].",
      "`print` follows each reference and outputs `6 5`.",
      st => { st.out.push("6 5"); });
  }),

  lesson({ id: "bowls", title: "One bowl, two labels", topic: "lists and aliasing",
    blurb: "A bowl can be added to, so two labels on one bowl both see every change.",
    code: ['bowl = ["egg", "flour"]', 'mixing = bowl', 'mixing.append("milk")', 'side = bowl.copy()', 'side.append("salt")', 'print(bowl, side)'] }, step => {
    step(1, "Crack an egg into a [mixing bowl|list] and add flour. Label it `bowl`. A bowl is [open|mutable]: you can keep adding things. Spots in the bowl are counted from [0|index 0].",
      "A list is a mutable object. Its items are numbered from 0.",
      st => { st.heap.o1 = { t: "list", items: [P("'egg'"), P("'flour'")] }; g(st).bowl = R("o1"); });
    step(2, "Tie a `mixing` [label|name] to that same [bowl|list object]. There is still only one bowl on the shelf.",
      "`mixing = bowl` is aliasing: two names, one list. No copy is made.",
      st => { g(st).mixing = R("o1"); });
    step(3, "Pour milk into the bowl labeled `mixing`. Now look in the bowl labeled `bowl`: the milk is there, because it's the [same bowl|same object].",
      "`.append()` changes the list in place, so every name that refers to it sees the change.",
      st => { st.heap.o1.items.push(P("'milk'")); });
    step(4, "Take a [second bowl|new list], put the same ingredients in it, and label it `side`.",
      "`.copy()` builds a new list with the same items. `side` refers to a different object.",
      st => { st.heap.o2 = { t: "list", items: JSON.parse(JSON.stringify(st.heap.o1.items)) }; g(st).side = R("o2"); });
    step(5, "Salt goes into the side bowl only.",
      "Changing the copy leaves the original list alone.",
      st => { st.heap.o2.items.push(P("'salt'")); });
    step(6, "[Serve|print] both bowls. Moving a [label|name] never moves food. Only a second bowl gives you a separate batch.",
      "`=` never copies a list. Use `.copy()`, `list(x)` or `x[:]` when you need an independent one.",
      st => { st.out.push("['egg', 'flour', 'milk'] ['egg', 'flour', 'milk', 'salt']"); });
  }),

  lesson({ id: "loops", title: "Weigh each ingredient", topic: "for loops",
    blurb: "A for loop does the same steps once for every item, like weighing ingredients one at a time.",
    code: ['weight = 0', 'for grams in [200, 150, 50]:', '    weight += grams', 'print(weight)'] }, step => {
    step(1, "Zero the kitchen scale and write 0 on [masking tape|a variable] called `weight`. Small numbers are written straight on the tape, so they don't need a jar.",
      "`weight` is bound to 0. Small values are drawn inline to keep the picture readable.",
      st => { g(st).weight = P(0, { ico: "⚖️" }); });
    step(2, "Line up flour, butter and chocolate on a [prep tray|list]. [Pick up|the loop takes] the first one: 200 g of flour. The `grams` tape now reads 200.",
      "The `for` loop takes item 0 from the list and binds `grams` to it.",
      st => { st.heap.o1 = { t: "list", vessel: "tray", k: "Prep tray", hold: true, hl: 0,
                items: [P(200, { ico: "🌾" }), P(150, { ico: "🧈" }), P(50, { ico: "🍫" })] };
              g(st).grams = P(200, { ico: "🌾" }); });
    step(3, "Put it on the scale: 0 + 200 = 200.",
      "`weight += grams` is shorthand for `weight = weight + grams`.",
      st => { g(st).weight = P(200, { ico: "⚖️" }); });
    step(2, "[Repeat|next iteration] with the next ingredient: 150 g of butter.",
      "Back to the loop header: `grams` is rebound to item 1.",
      st => { st.heap.o1.hl = 1; g(st).grams = P(150, { ico: "🧈" }); });
    step(3, "200 + 150 = 350.",
      "The indented body runs once per item.",
      st => { g(st).weight = P(350, { ico: "⚖️" }); });
    step(2, "The last ingredient: 50 g of chocolate.",
      "Item 2, the final one.",
      st => { st.heap.o1.hl = 2; g(st).grams = P(50, { ico: "🍫" }); });
    step(3, "350 + 50 = 400.",
      "The body runs for the third time.",
      st => { g(st).weight = P(400, { ico: "⚖️" }); });
    step(2, "Nothing left on the tray, so you [stop repeating|the loop ends]. `grams` still shows the last thing you weighed. Nobody needs the tray now, so it goes in the [sink|garbage].",
      "The loop ends when the list runs out. Loop variables keep their last value afterwards. Nothing refers to the list any more.",
      st => { delete st.heap.o1.hl; delete st.heap.o1.hold; });
    step(4, "The sink is [washed up|garbage-collected] and the total weight goes out on an [order ticket|print output].",
      "`print(weight)` outputs 400. The unused list has been garbage-collected.",
      st => { delete st.heap.o1; st.out.push("400"); });
  }),

  lesson({ id: "recipes", title: "Recipe cards", topic: "functions",
    blurb: "A function is a recipe card. Each time you use it, a fresh cutting board comes out, gets used, and is put away.",
    code: ['def make_tea(leaf):', '    cup = leaf + " tea"', '    return cup', '', 'order = make_tea("mint")', 'print(order)'] }, step => {
    step(1, "Write a [recipe card|function] and stand it on the shelf, labeled `make_tea`. Writing the card doesn't brew anything yet.",
      "`def` creates a function object and binds the name `make_tea` to it. The body does not run yet.",
      st => { st.heap.o1 = { t: "func", v: "make_tea(leaf)" }; g(st).make_tea = R("o1"); });
    step(5, "An order comes in. A cook takes out a fresh [cutting board|frame] for this recipe and labels the jar of mint you handed over `leaf`, the [ingredient the card asks for|parameter].",
      "Calling `make_tea(\"mint\")` creates a new frame. The parameter `leaf` is bound to the argument.",
      st => { st.heap.o2 = { t: "str", v: "'mint'", fill: "🌿" }; st.frames.push({ name: "make_tea", vars: { leaf: R("o2") } }); });
    step(2, "On that board, brew a cup and label it `cup`. This [tape|local variable] only exists on this board; the main board can't see it.",
      "`cup` is a local variable. It lives in the function's frame, not the global frame.",
      st => { st.heap.o3 = { t: "str", v: "'mint tea'", vessel: "cup", k: "Teacup" }; active(st).cup = R("o3"); });
    step(3, "Put the cup on the [plate|return value] to hand back.",
      "`return cup` sets the return value to the object `cup` refers to.",
      st => { active(st).$ret = R("o3"); });
    step(5, "The board is [put away|frame destroyed] and its tape is thrown out. The tea is handed back and gets a new label, `order`. The mint jar has no label left, so it goes in the [sink|garbage].",
      "The frame is destroyed, so `leaf` and `cup` disappear. The returned object survives as `order`. The 'mint' string has no references left.",
      st => { st.frames.pop(); g(st).order = R("o3"); });
    step(6, "The sink is [washed up|garbage-collected] and the tea goes out on an [order ticket|print output].",
      "Unreferenced objects are garbage-collected. `print` outputs `mint tea`.",
      st => { delete st.heap.o2; st.out.push("mint tea"); });
  }),

  lesson({ id: "layers", title: "A cake that makes cakes", topic: "recursion",
    blurb: "A recipe that uses itself on a smaller job, until the job is simple enough to do directly.",
    code: ['def cake(layers):', '    if layers == 1:', '        return "base"', '    return cake(layers - 1) + "+layer"', '', 'print(cake(3))'] }, step => {
    step(1, "Write the cake [recipe card|function]. Its last line says: make a cake with one fewer layer, then add a layer on top. The recipe [uses itself|recursion].",
      "Defines a recursive function, one that calls itself.",
      st => { st.heap.o1 = { t: "func", v: "cake(layers)" }; g(st).cake = R("o1"); });
    step(6, "Order in: a 3-layer cake. [Cutting board 1|frame for cake(3)] comes out.",
      "`cake(3)` is called, creating a frame with `layers = 3`.",
      st => { st.frames.push({ name: "cake", vars: { layers: P(3) } }); });
    step(2, "[Check the order|if test]: is this a 1-layer cake? No.",
      "`3 == 1` is False, so `return \"base\"` is skipped.");
    step(4, "Board 1 can't finish until it has a 2-layer cake. It [waits|pauses] and a [second board|new frame] comes out.",
      "`cake(2)` is called. The first frame pauses mid-line and stays on the call stack.",
      st => { st.frames.push({ name: "cake", vars: { layers: P(2) } }); });
    step(2, "Is this a 1-layer cake? Still no.",
      "`2 == 1` is False.");
    step(4, "Board 2 waits too and a third board comes out. Three boards are busy at once, each with its own `layers` [tape|local variable].",
      "A third frame. Every call has its own local variables.",
      st => { st.frames.push({ name: "cake", vars: { layers: P(1) } }); });
    step(2, "Board 3 only needs one layer. This is the [easy case|base case].",
      "`1 == 1` is True. This is the base case that stops the recursion.");
    step(3, "Board 3 bakes a sponge base and sets it on its [plate|return value].",
      "`cake(1)` returns `\"base\"`.",
      st => { active(st).$ret = P("'base'", { cake: 1 }); });
    step(4, "Board 3 is [put away|frame destroyed]. Board 2 takes the base, adds a layer of cream, and plates it.",
      "Back in the `layers = 2` frame: `\"base\" + \"+layer\"`.",
      st => { st.frames.pop(); active(st).$ret = P("'base+layer'", { cake: 2 }); });
    step(4, "Board 2 is put away. Board 1 adds the final layer.",
      "Back in the `layers = 3` frame, which can finally finish its line.",
      st => { st.frames.pop(); active(st).$ret = P("'base+layer+layer'", { cake: 3 }); });
    step(6, "Every board is put away and the cake goes out on an [order ticket|print output]. Without the 1-layer rule, boards would keep coming out until the counter ran out of room.",
      "The stack unwinds and `print` runs. With no base case, Python would stop with `RecursionError`.",
      st => { st.frames.pop(); st.out.push("base+layer+layer"); });
  }),

  lesson({ id: "drawers", title: "The spice cabinet", topic: "dictionaries",
    blurb: "A dictionary looks things up by name instead of by position.",
    code: ['spices = {"salt": 3}', 'spices["pepper"] = 2', 'spices["salt"] -= 1', 'for name, qty in spices.items():', '    print(name, qty)'] }, step => {
    const spoons = n => P(n, { ico: "🥄", rep: n });
    step(1, "A [spice cabinet|dict]. Each drawer has a [name on the front|key] and an [amount inside|value]. No two drawers share a name.",
      "A dict maps unique keys to values.",
      st => { st.heap.o1 = { t: "dict", items: [["'salt'", spoons(3)]] }; g(st).spices = R("o1"); });
    step(2, "Fit a [new drawer|new key] for pepper and put 2 spoons in it.",
      "Assigning to a new key adds an entry.",
      st => { st.heap.o1.items.push(["'pepper'", spoons(2)]); });
    step(3, "Use a spoon of salt. [Same drawer|same key], new amount.",
      "Assigning to an existing key replaces its value. `-=` reads 3 and writes 2.",
      st => { st.heap.o1.items[0][1] = spoons(2); });
    step(4, "[Walk along the drawers|loop over .items()]. At each one, copy the [name|key] and the [amount|value] onto two pieces of tape.",
      "`.items()` gives (key, value) pairs. The loop unpacks each pair into `name` and `qty`.",
      st => { st.heap.o1.hl = 0; g(st).name = P("'salt'"); g(st).qty = P(2, { ico: "🥄" }); });
    step(5, "Send it out on an [order ticket|print output].",
      "Prints the first pair.",
      st => { st.out.push("salt 2"); });
    step(4, "Next drawer.",
      "The second pair.",
      st => { st.heap.o1.hl = 1; g(st).name = P("'pepper'"); g(st).qty = P(2, { ico: "🥄" }); });
    step(5, "Send it out.",
      "Prints the second pair.",
      st => { st.out.push("pepper 2"); });
    step(4, "End of the cabinet. Drawers stay in the [order you fitted them|insertion order].",
      "Dicts keep insertion order, so `salt` came before `pepper`.",
      st => { delete st.heap.o1.hl; });
  }),
];

/* ------------------------------------------------------------------ drawing */

const W = 1200, H = 780;
const SHELF_LOW = 372, SHELF_HIGH = 196, PLANK = 14, SHELF_X0 = 30, SHELF_X1 = 870;
const COUNTER = 462, COUNTER_END = 700, EDGE = 14;
const BOARD_X0 = 30, BOARD_X1 = 880, BOARD_Y = 516, BOARD_MAXH = 176;
const SINK = { x: 930, y: 520, w: 240, h: 110 };
const HATCH = { x: 905, y: 30, w: 270, h: 262 };

const ingOf = v => v.ico || INGREDIENT[v.p] || "";
const txt = (x, y, cls, s, anchor = "start", extra = "") => `<text x="${x}" y="${y}" class="${cls}" text-anchor="${anchor}" ${extra}>${s}</text>`;
const emoji = (x, y, size, s) => s ? `<text x="${x}" y="${y}" class="emoji" font-size="${size}" text-anchor="middle">${s}</text>` : "";
const trunc = (s, n) => s.length > n ? s.slice(0, n - 1) + "…" : s;

function cakeSVG(x, bottom, n) {
  let s = "";
  for (let k = 0; k < n; k++) s += `<rect x="${x + (k ? 2 : 0)}" y="${bottom - 9 - k * 9}" width="${k ? 30 : 34}" height="9" rx="2" class="${k ? "creamy" : "sponge"}"/>`;
  return s;
}

/* a value written on a paper chip, right-aligned at xr */
function chipW(v) {
  return (ingOf(v) ? 22 * (v.rep || 1) + 4 : 0) + (v.cake ? 42 : 0) + v.p.length * 7.9 + 18;
}
function chipSVG(xr, cy, v) {
  const w = chipW(v), x = xr - w;
  let s = `<rect x="${x}" y="${cy - 14}" width="${w}" height="28" rx="5" class="paper"/>`, cx = x + 9;
  if (v.cake) { s += cakeSVG(cx, cy + 10, v.cake); cx += 42; }
  else if (ingOf(v)) { const n = v.rep || 1; for (let k = 0; k < n; k++) s += emoji(cx + 10 + k * 22, cy + 7, 18, ingOf(v)); cx += 22 * n + 4; }
  return s + txt(cx, cy + 5, "t-val", esc(v.p));
}

/* vessels: drawn in local coords, x from 0..w, sitting on y = 0 */
function vessel(o) {
  const kind = o.vessel || { int: "jar", str: "jar", list: "bowl", dict: "cabinet", func: "card" }[o.t];
  if (kind === "jar") {
    let fill = "";
    if (o.cubes) for (let k = 0; k < o.cubes; k++) fill += `<rect class="cube" x="${19 + (k % 3) * 20}" y="${-24 - Math.floor(k / 3) * 19}" width="16" height="16" rx="2"/>`;
    else fill = emoji(48, -14, 34, o.fill) + emoji(30, -18, 26, o.fill) + emoji(66, -20, 26, o.fill);
    return { w: 96, h: 128, svg:
      `<rect x="4" y="-112" width="88" height="112" rx="16" class="glass"/>${fill}
       <rect x="10" y="-126" width="76" height="17" rx="4" class="lid"/><rect x="10" y="-113" width="76" height="4" class="lid-dark"/>
       <rect x="14" y="-100" width="68" height="28" rx="3" class="paper"/>${txt(48, -81, "t-val", esc(trunc(o.v, 8)), "middle")}
       <path d="M16,-62 L16,-20" class="glass-shine"/>` };
  }
  if (kind === "cup") {
    return { w: 132, h: 98, svg:
      `<ellipse cx="62" cy="-7" rx="58" ry="8" class="china"/>
       <path d="M96,-60 C124,-60 124,-28 90,-27" class="china-line"/>
       <path d="M20,-72 L102,-72 Q100,-18 61,-16 Q22,-18 20,-72 Z" class="china"/>
       <ellipse cx="61" cy="-70" rx="39" ry="6" class="tea"/>${emoji(61, -64, 15, "🌿")}
       <path d="M48,-82 q-6,-8 0,-14 t0,-12 M70,-80 q-6,-8 0,-14 t0,-12" class="steam"/>` };
  }
  if (kind === "card") {
    return { w: 180, h: 120, svg:
      `<g transform="rotate(-4 90 0)"><rect x="6" y="-114" width="168" height="112" rx="3" class="paper"/>
       <rect x="6" y="-114" width="168" height="7" class="lid"/>
       ${txt(18, -90, "t-tiny", "RECIPE")}${txt(18, -68, "t-recipe", esc(o.v))}
       <path d="M18,-50 H160 M18,-36 H160 M18,-22 H130" stroke="var(--paper-edge)" stroke-width="1.5"/></g>` };
  }
  if (kind === "cabinet") {
    const n = o.items.length, w = 270, h = 20 + n * 50;
    let s = `<rect x="0" y="${-h}" width="${w}" height="${h}" rx="6" class="wood"/>`;
    o.items.forEach(([k, v], i) => {
      const y = -h + 10 + i * 50;
      s += `<rect x="10" y="${y}" width="${w - 20}" height="42" rx="4" class="${o.hl === i ? "hl" : "drawer"}"/>
        <circle cx="26" cy="${y + 21}" r="5" class="knob"/>${emoji(48, y + 29, 22, INGREDIENT[k])}
        ${txt(66, y + 19, "t-val", esc(k))}${txt(66, y + 34, "t-py", "key")}
        ${emoji(w - 90 - ((v.rep || 1) - 1) * 9, y + 28, 17, "🥄".repeat(v.rep || 1))}
        ${txt(w - 22, y + 19, "t-val", esc(v.p), "end")}${txt(w - 22, y + 34, "t-py", "value", "end")}`;
    });
    return { w, h, svg: s };
  }
  if (kind === "tray") {
    const n = o.items.length, w = n * 78 + 24;
    let s = "";
    o.items.forEach((v, i) => {
      const cx = 12 + 39 + i * 78;
      if (o.hl === i) s += `<rect x="${cx - 34}" y="-78" width="68" height="50" rx="8" class="hl"/>`;
      s += emoji(cx, -36, 34, ingOf(v));
    });
    s += `<rect x="0" y="-30" width="${w}" height="30" rx="5" class="steel"/><rect x="-4" y="-34" width="${w + 8}" height="7" rx="3" class="steel-dark"/>`;
    o.items.forEach((v, i) => {
      const cx = 12 + 39 + i * 78;
      s += `<text x="${cx}" y="-10" text-anchor="middle"><tspan class="t-val">${esc(v.p)} g </tspan><tspan class="t-py">[${i}]</tspan></text>`;
    });
    return { w, h: 80, svg: s };
  }
  // bowl
  const n = o.items.length, w = Math.max(150, n * 66 + 36);
  let s = "";
  o.items.forEach((v, i) => {
    const cx = 18 + 33 + i * 66;
    if (o.hl === i) s += `<rect x="${cx - 30}" y="-90" width="60" height="80" rx="8" class="hl"/>`;
    s += emoji(cx, -52, 32, ingOf(v));
  });
  s += `<path d="M0,-70 C0,-16 ${w * .25},0 ${w / 2},0 C${w * .75},0 ${w},-16 ${w},-70 Z" class="glass"/>`;
  o.items.forEach((v, i) => {
    const cx = 18 + 33 + i * 66;
    s += txt(cx, -34, "t-val", esc(v.p), "middle") + txt(cx, -19, "t-py", `[${i}]`, "middle");
  });
  s += `<rect x="-5" y="-74" width="${w + 10}" height="8" rx="4" class="glass"/><path d="M14,-58 Q16,-34 30,-22" class="glass-shine"/>`;
  return { w, h: 104, svg: s };
}

function reachable(st) {
  const seen = new Set();
  const visit = v => {
    if (!v || !v.r || seen.has(v.r)) return;
    seen.add(v.r);
    const o = st.heap[v.r];
    (o.items || []).forEach(it => visit(o.t === "dict" ? it[1] : it));
  };
  st.frames.forEach(f => Object.values(f.vars).forEach(visit));
  Object.entries(st.heap).forEach(([id, o]) => { if (o.hold) visit(R(id)); });
  return seen;
}

function backdrop() {
  let s = `<defs>
    <pattern id="tiles" width="56" height="56" patternUnits="userSpaceOnUse">
      <rect width="56" height="56" class="wall"/>
      <path d="M0,0.75 H56 M0,28.75 H56 M0.75,0 V28 M28.75,28 V56" class="grout"/>
    </pattern>
    <marker id="tie" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--twine)"/></marker>
  </defs>
  <rect width="${W}" height="${COUNTER}" fill="url(#tiles)"/>`;
  for (const y of [SHELF_HIGH, SHELF_LOW]) {
    s += `<rect x="${SHELF_X0}" y="${y}" width="${SHELF_X1 - SHELF_X0}" height="${PLANK}" rx="2" class="plank"/>
      <rect x="${SHELF_X0}" y="${y + PLANK - 4}" width="${SHELF_X1 - SHELF_X0}" height="4" class="plank-dark"/>
      <path d="M${SHELF_X0 + 50},${y + PLANK} h14 l-14,26 z M${SHELF_X1 - 64},${y + PLANK} h14 v26 z" class="plank-dark"/>`;
  }
  s += txt(SHELF_X0, 30, "t-head", "SHELVES") + txt(SHELF_X0, 47, "t-py", "objects in memory (the heap)");
  const { x, y, w, h } = HATCH;
  s += `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" class="frame"/>
    <rect x="${x + 14}" y="${y + 14}" width="${w - 28}" height="${h - 28}" class="opening"/>
    <line x1="${x + 20}" y1="${y + 34}" x2="${x + w - 20}" y2="${y + 34}" class="rail"/>
    <rect x="${x - 12}" y="${y + h - 4}" width="${w + 24}" height="16" rx="3" class="plank"/>
    ${emoji(x + w - 30, y + h - 6, 30, "🛎️")}
    ${txt(x, y + h + 40, "t-k", "Serving hatch")}${txt(x, y + h + 57, "t-py", "print() output")}`;
  const tx = SINK.x + SINK.w / 2;
  s += `<rect x="${tx - 7}" y="${COUNTER - 72}" width="14" height="72" class="steel"/>
    <path d="M${tx},${COUNTER - 66} q0,-26 -30,-26 h-16 v10" fill="none" stroke="var(--steel-dark)" stroke-width="12" stroke-linecap="round"/>
    <rect x="${tx - 22}" y="${COUNTER - 42}" width="44" height="8" rx="4" class="steel-dark"/>`;
  s += `<rect x="0" y="${COUNTER}" width="${W}" height="${COUNTER_END - COUNTER}" class="stone"/>
    <rect x="0" y="${COUNTER - 5}" width="${W}" height="5" class="stone-edge"/>`;
  for (let k = 0; k < 70; k++) {
    const fx = (k * 173) % W, fy = COUNTER + 10 + ((k * 97) % (COUNTER_END - COUNTER - 20));
    s += `<circle cx="${fx}" cy="${fy}" r="${1 + (k % 3)}" class="fleck"/>`;
  }
  s += `<rect x="0" y="${COUNTER_END}" width="${W}" height="${EDGE}" class="stone-edge"/>
    <rect x="0" y="${COUNTER_END + EDGE}" width="${W}" height="${H - COUNTER_END - EDGE}" class="cab"/>`;
  for (let k = 0; k < 6; k++) {
    const dx = 14 + k * 198;
    s += `<rect x="${dx}" y="${COUNTER_END + EDGE + 10}" width="182" height="${H - COUNTER_END - EDGE}" rx="4" class="cab-door"/>
      <rect x="${dx + (k % 2 ? 14 : 152)}" y="${COUNTER_END + EDGE + 24}" width="16" height="6" rx="3" class="handle"/>`;
  }
  s += txt(BOARD_X0, COUNTER + 26, "t-head", "COUNTERTOP") + txt(BOARD_X0, COUNTER + 43, "t-py", "frames (the call stack)");
  s += `<rect x="${SINK.x}" y="${SINK.y}" width="${SINK.w}" height="${SINK.h}" rx="18" class="basin"/>
    <circle cx="${SINK.x + SINK.w / 2}" cy="${SINK.y + SINK.h - 18}" r="7" class="drain"/>
    ${txt(SINK.x, SINK.y + SINK.h + 24, "t-k", "Sink")}${txt(SINK.x + 46, SINK.y + SINK.h + 24, "t-py", "garbage collection")}`;
  return s;
}

function drawKitchen(st, prev) {
  const live = reachable(st);
  const ids = Object.keys(st.heap);
  const changedObj = id => prev && JSON.stringify(prev.heap[id]) !== JSON.stringify(st.heap[id]);
  let s = backdrop(), twine = "";
  const anchors = {};

  /* shelf objects: lower shelf first, overflow to the upper one */
  let x = SHELF_X0 + 14, shelfY = SHELF_LOW;
  const onShelf = ids.filter(id => live.has(id));
  if (!onShelf.length) s += txt(SHELF_X0 + 20, SHELF_LOW - 20, "t-muted", "Nothing on the shelves yet");
  for (const id of onShelf) {
    const o = st.heap[id], v = vessel(o);
    const [kname, pyname] = KIND[o.t];
    const capW = Math.max((o.k || kname).length * 8.6, pyname.length * 7.9) + 10;
    const w = Math.max(v.w, capW);
    if (x + w > SHELF_X1 - 10 && shelfY === SHELF_LOW && x > SHELF_X0 + 14) { x = SHELF_X0 + 14; shelfY = SHELF_HIGH; }
    const cx = x + w / 2, vx = cx - v.w / 2;
    if (changedObj(id)) s += `<rect x="${vx - 10}" y="${shelfY - v.h - 12}" width="${v.w + 20}" height="${v.h + 12}" rx="10" class="flash"/>`;
    s += `<g transform="translate(${vx},${shelfY})">${v.svg}</g>`;
    let cy = shelfY + PLANK + 18;
    if (o.vessel === "cup") {
      const tw = o.v.length * 7.9 + 16;
      s += `<rect x="${cx - tw / 2}" y="${shelfY + 2}" width="${tw}" height="20" rx="3" class="paper"/>${txt(cx, shelfY + 17, "t-val", esc(o.v), "middle")}`;
      cy += 12;
    }
    s += txt(cx, cy, "t-k", o.k || kname, "middle") + txt(cx, cy + 16, "t-py", pyname, "middle");
    if (o.hold) { s += txt(cx, cy + 32, "t-py", "being looped over", "middle"); cy += 16; }
    anchors[id] = [cx, cy + 24];
    x += w + 34;
  }

  /* sink: objects nothing refers to any more */
  ids.filter(id => !live.has(id)).forEach((id, k) => {
    const v = vessel(st.heap[id]);
    const sc = Math.min(.55, 150 / v.w);
    s += `<g transform="translate(${SINK.x + 40 + k * 90},${SINK.y + SINK.h - 14}) rotate(-12) scale(${sc})" opacity=".85">${v.svg}</g>`;
  });

  /* cutting boards = frames */
  const multi = st.frames.length > 1;
  const boards = st.frames.map((f, fi) => {
    const rows = Object.entries(f.vars);
    const title = fi === 0 ? "Main board" : `Cutting board ${fi}`;
    const sub = fi === 0 ? "global frame" : `frame: ${f.name}()`;
    let w = Math.max(210, title.length * 8.6 + (multi ? 96 : 30), sub.length * 7.9 + 30);
    rows.forEach(([name, v]) => {
      const left = name === "$ret" ? 150 : Math.max(name.length * 10.5 + 26, 76);
      const right = v.r ? 24 : chipW(v);
      w = Math.max(w, 16 + left + 22 + right + 16);
    });
    const h = 62 + Math.max(1, rows.length) * 50;
    return { f, fi, rows, title, sub, w, h };
  });
  const total = boards.reduce((a, b) => a + b.w + 34, -34);
  const maxH = Math.max(...boards.map(b => b.h));
  const sc = Math.min(1, (BOARD_X1 - BOARD_X0) / total, BOARD_MAXH / maxH);
  const T = (px, py) => [BOARD_X0 + (px - BOARD_X0) * sc, BOARD_Y + (py - BOARD_Y) * sc];
  let bs = "", bx = BOARD_X0;
  const pframes = prev ? prev.frames : [];
  for (const b of boards) {
    const isActive = b.fi === st.frames.length - 1;
    const pf = pframes[b.fi] && pframes[b.fi].name === b.f.name ? pframes[b.fi] : null;
    const by = BOARD_Y;
    bs += `<g class="${multi && !isActive ? "waiting" : ""}">
      <rect x="${bx + b.w - 6}" y="${by + b.h / 2 - 16}" width="28" height="32" rx="12" class="board"/>
      <circle cx="${bx + b.w + 10}" cy="${by + b.h / 2}" r="5" class="hole"/>
      <rect x="${bx}" y="${by}" width="${b.w}" height="${b.h}" rx="16" class="board"/>
      <path d="M${bx + 20},${by + b.h - 14} q${b.w / 3},-6 ${b.w - 40},0" class="board-grain"/>
      ${multi && isActive ? `<rect x="${bx - 4}" y="${by - 4}" width="${b.w + 8}" height="${b.h + 8}" rx="19" class="ring"/>` : ""}
      ${txt(bx + 16, by + 24, "t-k-board", b.title)}${txt(bx + 16, by + 41, "t-py", esc(b.sub))}
      ${multi ? txt(bx + b.w - 16, by + 24, "t-k-board", isActive ? "cooking" : "waiting", "end") + txt(bx + b.w - 16, by + 41, "t-py", isActive ? "running" : "paused", "end") : ""}`;
    if (!b.rows.length) bs += txt(bx + 16, by + 82, "t-k-board", "No tape yet", "start", 'opacity=".6" font-style="italic"');
    b.rows.forEach(([name, v], ri) => {
      const ry = by + 56 + ri * 50;
      const changed = prev && (!pf || JSON.stringify(pf.vars[name]) !== JSON.stringify(v));
      if (changed) bs += `<rect x="${bx + 6}" y="${ry - 4}" width="${b.w - 12}" height="48" rx="8" class="flash"/>`;
      if (name === "$ret") {
        bs += `<ellipse cx="${bx + 38}" cy="${ry + 20}" rx="24" ry="10" class="china"/><ellipse cx="${bx + 38}" cy="${ry + 19}" rx="15" ry="5.5" fill="none" stroke="var(--china-edge)" stroke-width="1.5"/>
          ${txt(bx + 70, ry + 16, "t-k-board", "Plate")}${txt(bx + 70, ry + 33, "t-py", "return value")}`;
      } else {
        const tw = name.length * 10.5 + 22;
        bs += `<g transform="rotate(-1.5 ${bx + 16} ${ry})"><rect x="${bx + 16}" y="${ry}" width="${tw}" height="28" class="tape"/>
          ${txt(bx + 27, ry + 21, "t-hand", esc(name))}</g>${txt(bx + 18, ry + 42, "t-py", "variable")}`;
      }
      const xr = bx + b.w - 16, cy = ry + 16;
      if (v.r) {
        bs += `<circle cx="${xr - 9}" cy="${cy}" r="8" class="knot"/>`;
        if (anchors[v.r]) {
          const [kx, ky] = T(xr - 9, cy), [ax, ay] = anchors[v.r];
          const dy = Math.max(40, (ky - ay) / 2);
          twine += `<path d="M${kx},${ky} C${kx},${ky - dy} ${ax},${ay + dy} ${ax},${ay + 3}" class="twine${changed ? " new" : ""}" marker-end="url(#tie)"/>`;
        }
      } else {
        bs += chipSVG(xr, cy, v);
      }
    });
    bs += `</g>`;
    bx += b.w + 34;
  }
  s += `<g transform="translate(${BOARD_X0} ${BOARD_Y}) scale(${sc}) translate(${-BOARD_X0} ${-BOARD_Y})">${bs}</g>`;

  /* order tickets in the hatch */
  const { x: hx, y: hy, w: hw, h: hh } = HATCH;
  if (!st.out.length) s += txt(hx + hw / 2, hy + hh / 2 + 10, "t-open", "No orders out yet", "middle");
  let ty = hy + 42;
  st.out.forEach((line, n) => {
    const chunks = line.match(/.{1,26}(\s|$)|.{1,26}/g).map(c => c.trimEnd());
    const th = 30 + chunks.length * 17;
    const fresh = prev && n >= prev.out.length;
    s += `${fresh ? `<rect x="${hx + 22}" y="${ty - 4}" width="${hw - 44}" height="${th + 8}" rx="6" class="flash"/>` : ""}
      <rect x="${hx + 28}" y="${ty}" width="${hw - 56}" height="${th}" class="paper" transform="rotate(${n % 2 ? 1.2 : -1.2} ${hx + hw / 2} ${ty})"/>
      <rect x="${hx + hw / 2 - 12}" y="${ty - 8}" width="24" height="12" rx="2" class="steel"/>
      ${txt(hx + 40, ty + 18, "t-tiny", `ORDER ${n + 1}`)}
      ${chunks.map((c, k) => txt(hx + 40, ty + 36 + k * 17, "t-ticket", esc(c))).join("")}`;
    ty += th + 14;
  });

  return s + twine;
}

/* ------------------------------------------------------------------ page */

function highlight(src) {
  const re = /("[^"]*"|'[^']*')|\b(def|return|if|for|in|while|else|elif)\b|\b(\d+)\b|\b(print|len|range)\b/g;
  let out = "", last = 0, m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index));
    out += `<span class="${m[1] ? "st" : m[2] ? "kw" : m[3] ? "nu" : "bi"}">${esc(m[0])}</span>`;
    last = re.lastIndex;
  }
  return out + esc(src.slice(last));
}

let L = LESSONS[0], i = 0, timer = null;

function render() {
  const step = L.steps[i], prev = i > 0 ? L.steps[i - 1].st : null;
  $("#ltitle").textContent = L.title;
  $("#lblurb").textContent = L.blurb;
  $("#code").innerHTML = L.code.map((src, n) =>
    `<li class="${step.line === n + 1 ? "cur" : ""}"><span class="ln">${n + 1}</span><span>${highlight(src) || " "}</span></li>`).join("");
  $("#nk").innerHTML = fmt(step.k);
  $("#npy").innerHTML = fmt(step.py);
  $("#kitchen").innerHTML = drawKitchen(step.st, prev);

  const last = L.steps.length - 1;
  $("#count").textContent = `Step ${i} of ${last}`;
  $("#scrub").max = last; $("#scrub").value = i;
  $("#b-first").disabled = $("#b-prev").disabled = i === 0;
  $("#b-next").disabled = i === last;
  $("#b-next").textContent = i === 0 ? "Start cooking" : "Next step";
  $("#b-play").textContent = timer ? "Pause" : "Play";
  document.querySelectorAll("#lessons button").forEach(b => b.setAttribute("aria-pressed", b.dataset.id === L.id));
}

function go(n) { i = Math.max(0, Math.min(L.steps.length - 1, n)); render(); }
function stop() { clearInterval(timer); timer = null; }
function pick(id) {
  stop();
  L = LESSONS.find(l => l.id === id) || LESSONS[0];
  i = 0;
  try { localStorage.setItem("pk-lesson", L.id); } catch (e) {}
  render();
}

$("#recipe-head").innerHTML = term("The recipe", "your code");
$("#lessons").innerHTML = LESSONS.map((l, n) =>
  `<button type="button" data-id="${l.id}" aria-pressed="false"><span class="n">${n + 1}</span>${term(esc(l.title), esc(l.topic))}</button>`).join("");
$("#lessons").addEventListener("click", e => { const b = e.target.closest("button"); if (b) pick(b.dataset.id); });
$("#b-first").onclick = () => { stop(); go(0); };
$("#b-prev").onclick = () => { stop(); go(i - 1); };
$("#b-next").onclick = () => { stop(); go(i + 1); };
$("#b-play").onclick = () => {
  if (timer) { stop(); render(); return; }
  if (i === L.steps.length - 1) i = 0;
  timer = setInterval(() => { if (i >= L.steps.length - 1) { stop(); render(); } else go(i + 1); }, 2400);
  render();
};
$("#scrub").oninput = e => { stop(); go(+e.target.value); };
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "ArrowRight") { stop(); go(i + 1); }
  if (e.key === "ArrowLeft") { stop(); go(i - 1); }
});

let start = location.hash.slice(1);
if (!LESSONS.some(l => l.id === start)) { try { start = localStorage.getItem("pk-lesson") || ""; } catch (e) { start = ""; } }
pick(start);
</script>
