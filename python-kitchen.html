<title>Python Kitchen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Kalam:wght@700&display=swap">
<style>
/* Layout: recipe card + notes + controls on the left; an illustrated kitchen on the right (tiled wall with shelf on top,
   countertop with cutting boards and sink below, serving hatch at the bottom). Twine strings run from labels up to the shelf. */
:root {
  --bg: #dfe8e6;
  --panel: #ffffff;
  --ink: #1b2a2a;
  --muted: #5a6b6a;
  --line: #c9d8d5;
  --py: #2a55c9;           /* every Python term is printed in this blue */
  --tape: #f2e1ae; --tape-ink: #3d3214;
  --twine: #9a6326;
  --hl-bg: #fff2b8; --hl-edge: #e0b414;
  --tile: #f3f7f6; --grout: #d3dfdc;
  --wood: #ddb987; --wood-dark: #a9773f; --wood-ink: #3f2a12;
  --board: #e9cfa6;
  --stone: #b9c2c4; --stone-dark: #8f9a9d;
  --steel: #cfd7dc; --steel-dark: #8d9aa3;
  --glass: rgba(214, 233, 246, .65); --glass-edge: #8eaac0;
  --lid: #c4503b;
  --paper: #fffdf6;
  --plate: #ffffff; --plate-edge: #c7cfd3;
  --kw: #7b3fb5; --str: #2c7a4b; --num: #b4521a;
  --flash: rgba(224, 180, 20, .5);
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --hand: "Kalam", "Segoe Print", "Comic Sans MS", cursive;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1716; --panel: #172221; --ink: #e4eeec; --muted: #97aaa8; --line: #2b3b39; --py: #86abff;
  --tape: #dcc88f; --tape-ink: #2b2208; --twine: #e2ad66; --hl-bg: #3b3313; --hl-edge: #f0c93c;
  --tile: #1a2524; --grout: #243433; --wood: #7a5733; --wood-dark: #523a20; --wood-ink: #f5e6d0; --board: #5e4428;
  --stone: #2f3739; --stone-dark: #232a2c; --steel: #3d4950; --steel-dark: #27323a;
  --glass: rgba(120, 160, 190, .22); --glass-edge: #5f7f97; --lid: #d9664f;
  --paper: #22211c; --plate: #dfe5e8; --plate-edge: #9aa6ad;
  --kw: #c79bff; --str: #7fd39c; --num: #f2a56b; --flash: rgba(240, 201, 60, .35); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0f1716; --panel: #172221; --ink: #e4eeec; --muted: #97aaa8; --line: #2b3b39; --py: #86abff;
  --tape: #dcc88f; --tape-ink: #2b2208; --twine: #e2ad66; --hl-bg: #3b3313; --hl-edge: #f0c93c;
  --tile: #1a2524; --grout: #243433; --wood: #7a5733; --wood-dark: #523a20; --wood-ink: #f5e6d0; --board: #5e4428;
  --stone: #2f3739; --stone-dark: #232a2c; --steel: #3d4950; --steel-dark: #27323a;
  --glass: rgba(120, 160, 190, .22); --glass-edge: #5f7f97; --lid: #d9664f;
  --paper: #22211c; --plate: #dfe5e8; --plate-edge: #9aa6ad;
  --kw: #c79bff; --str: #7fd39c; --num: #f2a56b; --flash: rgba(240, 201, 60, .35); color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--body); }
.wrap { max-width: 1280px; margin: 0 auto; padding-inline: 18px; padding-block: 26px 48px; display: grid; gap: 18px; }

/* a kitchen word with its Python word underneath */
.term { display: inline-flex; flex-direction: column; line-height: 1.15; vertical-align: middle; }
.term .tk { font-weight: 600; }
.term .tp { font: 500 11px/1.3 var(--mono); color: var(--py); }
ruby { ruby-position: under; }
rt { font: 500 10.5px var(--mono); color: var(--py); padding-top: 1px; }

header { display: grid; gap: 6px; }
h1 { font: 800 clamp(30px, 5vw, 44px)/1.05 var(--display); margin: 0; text-wrap: balance; }
.sub { margin: 0; color: var(--muted); max-width: 68ch; }

.glossary { display: flex; flex-wrap: wrap; gap: 8px; }
.gl { display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px 6px 8px; font-size: 13px; }
.gl .ico { font-size: 20px; line-height: 1; }

nav.lessons { display: flex; flex-wrap: wrap; gap: 8px; }
nav.lessons button { display: flex; align-items: center; gap: 10px; text-align: left; font: 500 14px/1.2 var(--body); color: var(--ink);
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px 8px 10px; cursor: pointer; }
nav.lessons .n { font: 600 12px var(--mono); width: 22px; height: 22px; display: grid; place-items: center; border-radius: 50%; background: var(--bg); }
nav.lessons button[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
nav.lessons button[aria-pressed="true"] .n { background: var(--ink); color: var(--bg); }

.stage { display: grid; grid-template-columns: minmax(0, 4.2fr) minmax(0, 7.8fr); gap: 18px; align-items: start; }
@media (max-width: 960px) { .stage { grid-template-columns: minmax(0, 1fr); } }
.col { display: grid; gap: 14px; min-width: 0; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; }
.head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
.head .term .tk { font: 600 13px var(--body); text-transform: uppercase; letter-spacing: .1em; }
h2 { font: 600 22px/1.2 var(--display); margin: 0 0 4px; text-wrap: balance; }
.blurb { margin: 0 0 12px; color: var(--muted); }

/* recipe card = code */
.recipe { background: var(--paper); border: 1px solid var(--line); border-radius: 6px; overflow-x: auto; position: relative;
  background-image: linear-gradient(var(--lid), var(--lid)), repeating-linear-gradient(to bottom, transparent 0 29px, var(--line) 29px 30px);
  background-size: 100% 3px, 100% 100%; background-repeat: no-repeat, repeat; background-position: 0 0, 0 9px; }
.recipe ol { list-style: none; margin: 0; padding: 10px 0 8px; font: 14px/30px var(--mono); }
.recipe li { display: flex; white-space: pre; border-left: 4px solid transparent; padding-right: 14px; }
.recipe .ln { width: 38px; flex: none; text-align: right; padding-right: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.recipe li.cur { background: var(--hl-bg); border-left-color: var(--hl-edge); }
.recipe li.cur .ln { color: var(--ink); font-weight: 600; }
.kw { color: var(--kw); font-weight: 600; } .st { color: var(--str); } .nu { color: var(--num); } .bi { color: var(--py); }

.note { border-radius: 10px; padding: 12px 14px; min-width: 0; }
.note.k { background: var(--board); border: 1px solid var(--wood-dark); color: var(--wood-ink); }
.note.py { background: var(--panel); border: 1px solid var(--line); }
.note h3 { font: 600 11px/1 var(--body); text-transform: uppercase; letter-spacing: .12em; margin: 0 0 8px; opacity: .75; }
.note p { margin: 0; }
.note.k p { line-height: 2.3; }
.note code { font: 13px var(--mono); background: color-mix(in srgb, currentColor 10%, transparent); padding: 1px 5px; border-radius: 4px; }

.controls { display: grid; gap: 12px; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btns button { font: 500 14px/1 var(--body); padding: 10px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
.btns button.primary { background: var(--ink); border-color: var(--ink); color: var(--bg); font-weight: 600; }
.btns button:disabled { opacity: .4; cursor: default; }
.count { margin-left: auto; font: 13px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
input[type=range] { width: 100%; accent-color: var(--ink); }
.hint { font-size: 12px; color: var(--muted); margin: 0; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--hl-edge); outline-offset: 2px; }

/* ---------- the kitchen scene ---------- */
.scene { position: relative; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: var(--tile); }
#strings { position: absolute; inset: 0; pointer-events: none; z-index: 5; color: var(--twine); }
#strings path.s { fill: none; stroke: var(--twine); stroke-width: 2.2; stroke-linecap: round; stroke-dasharray: 7 3; opacity: .95; }
#strings path.s.new { stroke-width: 3.2; }
.zone-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
.zone-head .term .tk { font: 600 12px var(--body); text-transform: uppercase; letter-spacing: .12em; }

.wall { padding: 16px 16px 20px;
  background-color: var(--tile);
  background-image: linear-gradient(var(--grout) 1.5px, transparent 1.5px), linear-gradient(90deg, var(--grout) 1.5px, transparent 1.5px);
  background-size: 46px 23px; }
.shelf { display: flex; flex-wrap: wrap; align-items: flex-end; row-gap: 14px; min-height: 150px; }
.shelf .empty { width: 100%; border-bottom: 12px solid var(--wood); padding: 40px 12px 14px; color: var(--muted); font-style: italic; }

.obj { display: flex; flex-direction: column; align-items: stretch; min-width: 0; }
.obj .spot { display: flex; justify-content: center; align-items: flex-end; padding: 14px 16px 0; min-height: 110px;
  border-bottom: 12px solid var(--wood); box-shadow: 0 6px 0 -2px var(--wood-dark); }
.obj .cap { display: grid; justify-items: center; gap: 4px; padding: 10px 8px 2px; text-align: center; font-size: 13px; }
.obj .cap .val { font: 600 13px var(--mono); background: var(--paper); border: 1px solid var(--line); padding: 1px 7px; border-radius: 4px; }
.tag { font-size: 11px; padding: 3px 8px; border-radius: 999px; border: 1px dashed var(--wood-dark); background: var(--paper); }
.tag .term .tp { font-size: 10px; }

/* vessels */
.v-jar { position: relative; width: 86px; min-height: 92px; margin-top: 14px; background: var(--glass); border: 2.5px solid var(--glass-edge);
  border-radius: 12px 12px 18px 18px; display: flex; flex-wrap: wrap-reverse; align-content: flex-start; justify-content: center; gap: 3px; padding: 8px 6px; }
.v-jar::before { content: ""; position: absolute; left: 6px; right: 6px; top: -14px; height: 13px; background: var(--lid); border-radius: 5px 5px 2px 2px;
  box-shadow: inset 0 -3px 0 rgba(0,0,0,.18); }
.v-jar .fill { font-size: 26px; line-height: 1; }
.cube { width: 17px; height: 17px; background: #fbfbf8; border: 1px solid #c9c9bf; border-radius: 3px; box-shadow: inset -2px -2px 0 #e4e4dc; }
.v-cup { position: relative; width: 78px; height: 58px; background: var(--plate); border: 2px solid var(--plate-edge); border-radius: 4px 4px 34px 34px;
  margin-right: 16px; display: grid; place-items: start center; overflow: visible; }
.v-cup::after { content: ""; position: absolute; right: -18px; top: 10px; width: 18px; height: 22px; border: 4px solid var(--plate-edge); border-left: none; border-radius: 0 14px 14px 0; }
.v-cup .tea { width: 64px; height: 12px; margin-top: 5px; border-radius: 50%; background: #9c6b2b; display: grid; place-items: center; font-size: 15px; line-height: 0; }
.v-bowl, .v-tray { display: flex; gap: 4px; padding: 10px 14px 18px; background: var(--glass); border: 2.5px solid var(--glass-edge); max-width: 100%; flex-wrap: wrap; justify-content: center; }
.v-bowl { border-radius: 8px 8px 50% 50% / 8px 8px 60% 60%; padding-bottom: 26px; min-width: 120px; }
.v-tray { background: color-mix(in srgb, var(--steel) 85%, transparent); border-color: var(--steel-dark); border-radius: 6px; border-top-width: 1px; }
.slot { display: grid; justify-items: center; gap: 1px; padding: 4px 6px; border-radius: 8px; min-width: 50px; }
.slot .ing { font-size: 28px; line-height: 1.1; }
.slot .sv { font: 600 11px var(--mono); white-space: nowrap; }
.slot .si { font: 500 10px var(--mono); color: var(--py); }
.slot.on { background: var(--hl-bg); outline: 2px solid var(--hl-edge); }
.v-cabinet { display: grid; gap: 5px; padding: 7px; background: var(--wood); border: 3px solid var(--wood-dark); border-radius: 6px; min-width: 210px; }
.drawer { display: flex; align-items: center; gap: 8px; background: var(--board); border: 1.5px solid var(--wood-dark); border-radius: 4px; padding: 6px 8px; color: var(--wood-ink); }
.drawer.on { outline: 2.5px solid var(--hl-edge); }
.drawer .knob { width: 10px; height: 10px; border-radius: 50%; background: var(--wood-dark); flex: none; }
.drawer .dk { flex: 1; display: flex; align-items: center; gap: 6px; font: 600 13px var(--mono); }
.drawer .dk .ing { font-size: 20px; }
.drawer .dk small { font: 500 10px var(--mono); color: var(--py); display: block; }
.v-card { width: 150px; background: var(--paper); border: 1px solid var(--line); border-top: 4px solid var(--lid); border-radius: 3px; padding: 8px 10px 10px;
  font: 600 13px var(--mono); transform: rotate(-2deg); box-shadow: 0 2px 4px rgba(0,0,0,.12); display: grid; gap: 6px; }
.v-card i { display: block; height: 1px; background: var(--line); }

/* countertop */
.counter { position: relative; padding: 18px 16px 18px; background: linear-gradient(180deg, var(--stone) 0, var(--stone) 100%);
  border-top: 8px solid var(--stone-dark); }
.counter-grid { display: grid; grid-template-columns: minmax(0, 1fr) 190px; gap: 16px; align-items: start; }
@media (max-width: 620px) { .counter-grid { grid-template-columns: minmax(0, 1fr); } }
.stations { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start; min-width: 0; }
.board { position: relative; flex: 1 1 210px; max-width: 320px; background: var(--board); border: 2px solid var(--wood-dark); border-radius: 14px 30px 30px 14px;
  padding: 12px 18px 14px 14px; color: var(--wood-ink); display: grid; gap: 8px; box-shadow: 0 4px 0 var(--wood-dark); }
.board.waiting { opacity: .7; }
.board.working { box-shadow: 0 4px 0 var(--wood-dark), 0 0 0 4px var(--hl-edge); }
.bhead { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.bhead .state { font-size: 11px; text-align: right; }
.bhead .state .tk { font-weight: 500; }
.var { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 3px 4px; border-radius: 6px; }
.lab { display: grid; justify-items: start; gap: 2px; }
.tape { font: 700 17px/1 var(--hand); background: var(--tape); color: var(--tape-ink); padding: 6px 10px 4px; transform: rotate(-1.5deg);
  box-shadow: 0 1px 1px rgba(0,0,0,.15); overflow-wrap: anywhere; }
.lab .tp { font: 500 10px var(--mono); color: var(--py); padding-left: 2px; }
.plate { width: 30px; height: 30px; border-radius: 50%; background: var(--plate); border: 2px solid var(--plate-edge); box-shadow: inset 0 0 0 5px color-mix(in srgb, var(--plate-edge) 35%, transparent); flex: none; }
.plate-row { display: flex; align-items: center; gap: 8px; }
.knot { width: 14px; height: 14px; border-radius: 50%; background: var(--twine); box-shadow: 0 0 0 3px color-mix(in srgb, var(--twine) 30%, transparent); flex: none; }
.chip { display: inline-flex; align-items: center; gap: 5px; background: var(--paper); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; }
.chip code { font: 600 13px var(--mono); white-space: nowrap; }
.chip .ing { font-size: 18px; line-height: 1; }
.cake { display: inline-flex; flex-direction: column-reverse; align-items: center; }
.cake i { display: block; width: 34px; height: 9px; background: #e9b872; border: 1px solid #a8743a; border-radius: 3px; margin-top: -1px; }
.cake i:nth-child(n+2) { width: 30px; background: #f4d7e0; border-color: #c48a9c; }
.empty-note { color: var(--muted); font-size: 13px; font-style: italic; margin: 0; }
.board .empty-note { color: inherit; opacity: .7; }

.sink { border-radius: 12px; padding: 10px; background: var(--steel); border: 2px solid var(--steel-dark); display: grid; gap: 8px; }
.basin { min-height: 96px; border-radius: 10px; background: radial-gradient(circle at 50% 78%, var(--steel-dark) 0 6px, transparent 7px), linear-gradient(180deg, var(--steel-dark), var(--steel) 70%);
  box-shadow: inset 0 4px 10px rgba(0,0,0,.25); display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-end; gap: 6px; padding: 8px; }
.basin .obj { opacity: .75; transform: rotate(-8deg) scale(.8); }
.basin .obj .spot { border: none; box-shadow: none; min-height: 0; padding: 0; }
.basin .obj .cap { display: none; }
.sink .note-s { align-self: flex-start; font-size: 11px; color: var(--ink); opacity: .8; text-align: center; }

/* serving hatch */
.hatch { border-radius: 14px; border: 10px solid var(--wood); outline: 2px solid var(--wood-dark); background: var(--tile); padding: 14px 16px 16px; }
.tickets { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; }
.ticket { background: var(--paper); border: 1px solid var(--line); border-top: 3px dashed var(--line); padding: 8px 12px 10px; font: 14px/1.5 var(--mono);
  box-shadow: 0 2px 4px rgba(0,0,0,.1); overflow-wrap: anywhere; max-width: 100%; }
.ticket small { display: block; font: 500 10px var(--body); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }

.changed { animation: flash 1.2s ease-out; }
@keyframes flash { from { background-color: var(--flash); } to { background-color: transparent; } }
@media (prefers-reduced-motion: reduce) { .changed { animation: none; } }
</style>

<div class="wrap">
  <header>
    <h1>Python Kitchen</h1>
    <p class="sub">Step through short programs and watch what Python does in its kitchen. Every kitchen word has its Python word written underneath in blue.</p>
  </header>

  <div class="glossary" id="glossary" aria-label="Kitchen to Python dictionary"></div>

  <nav class="lessons" id="lessons" aria-label="Lessons"></nav>

  <div class="stage">
    <div class="col">
      <section class="panel">
        <div class="head" id="recipe-head"></div>
        <h2 id="ltitle"></h2>
        <p class="blurb" id="lblurb"></p>
        <div class="recipe"><ol id="code"></ol></div>
      </section>
      <section class="note k" aria-live="polite"><h3>In the kitchen</h3><p id="nk"></p></section>
      <section class="note py"><h3>In Python</h3><p id="npy"></p></section>
      <section class="panel controls">
        <div class="btns">
          <button id="b-first" type="button">Start</button>
          <button id="b-prev" type="button">Back</button>
          <button id="b-next" type="button" class="primary">Next step</button>
          <button id="b-play" type="button">Play</button>
          <span class="count" id="count"></span>
        </div>
        <input type="range" id="scrub" min="0" value="0" aria-label="Jump to step">
        <p class="hint">Tip: use the ← and → keys to step.</p>
      </section>
    </div>

    <div class="col">
      <section class="scene" id="scene">
        <svg id="strings" aria-hidden="true"></svg>
        <div class="wall">
          <div class="zone-head" id="shelf-head"></div>
          <div class="shelf" id="shelf"></div>
        </div>
        <div class="counter">
          <div class="zone-head" id="counter-head"></div>
          <div class="counter-grid">
            <div class="stations" id="stations"></div>
            <div class="sink">
              <div id="sink-head"></div>
              <div class="basin" id="basin"></div>
            </div>
          </div>
        </div>
      </section>
      <section class="hatch">
        <div class="zone-head" id="hatch-head"></div>
        <div class="tickets" id="out"></div>
      </section>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const term = (k, py) => `<span class="term"><span class="tk">${k}</span><span class="tp">${py}</span></span>`;
// `code` → <code>, [kitchen|python] → kitchen word with the Python word underneath
const fmt = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\[([^\]|]+)\|([^\]]+)\]/g, "<ruby>$1<rt>$2</rt></ruby>");

const INGREDIENT = { "'egg'": "🥚", "'flour'": "🌾", "'milk'": "🥛", "'salt'": "🧂", "'mint'": "🌿", "'pepper'": "🌶️" };
const P = (v, opt = {}) => ({ p: String(v), ...opt });
const R = id => ({ r: id });
const g = st => st.frames[0].vars;
const active = st => st.frames[st.frames.length - 1].vars;

const KIND = {
  int:  ["Sealed jar", "int object"],
  str:  ["Sealed jar", "str object"],
  list: ["Mixing bowl", "list object"],
  dict: ["Spice cabinet", "dict object"],
  func: ["Recipe card", "function object"],
};

function lesson(meta, script) {
  const steps = [];
  let st = { frames: [{ name: "global", vars: {} }], heap: {}, out: [] };
  const step = (line, k, py, fn) => {
    st = JSON.parse(JSON.stringify(st));
    if (fn) fn(st);
    steps.push({ line, k, py, st });
  };
  step(null, "A clean kitchen. The [shelf|memory] is empty and there are no [labels|variables] on the [counter|global frame] yet.",
    "Nothing has run. The global frame has no names and no objects exist.");
  script(step);
  return { ...meta, steps };
}

const LESSONS = [
  lesson({ id: "labels", title: "Labels and jars", topic: "variables",
    blurb: "A variable is a label tied to something on the shelf, not a box that holds it.",
    code: ['sugar = 5', 'backup = sugar', 'sugar = sugar + 1', 'print(sugar, backup)'] }, step => {
    step(1, "Fill a [jar|object] with 5 sugar cubes and seal it. Write `sugar` on a strip of [masking tape|variable name] and tie it to the jar with [twine|reference].",
      "`sugar = 5` creates an int object 5, then binds the name `sugar` to it.",
      st => { st.heap.o1 = { t: "int", v: "5", cubes: 5 }; g(st).sugar = R("o1"); });
    step(2, "Tie a second [label|name], `backup`, to the same [jar|object]. Still one jar of sugar, now with two labels.",
      "`backup = sugar` copies the reference, not the object. Both names refer to the same 5.",
      st => { g(st).backup = R("o1"); });
    step(3, "The jar is [sealed|immutable], so you can't drop in another cube. You fill a [new jar|new object] with 6 cubes and move the `sugar` [label|name] onto it. `backup` stays on the old jar.",
      "Ints are immutable. `sugar + 1` creates a new object 6 and `sugar` is rebound to it. `backup` still refers to 5.",
      st => { st.heap.o2 = { t: "int", v: "6", cubes: 6 }; g(st).sugar = R("o2"); });
    step(4, "Follow each [twine|reference] to its jar and send what you find out through the [serving hatch|output].",
      "`print` follows each reference and outputs `6 5`.",
      st => { st.out.push("6 5"); });
  }),

  lesson({ id: "bowls", title: "One bowl, two labels", topic: "lists and aliasing",
    blurb: "A bowl can be added to, so two labels on one bowl both see every change.",
    code: ['bowl = ["egg", "flour"]', 'mixing = bowl', 'mixing.append("milk")', 'side = bowl.copy()', 'side.append("salt")', 'print(bowl, side)'] }, step => {
    step(1, "Crack an egg into a [mixing bowl|list] and add flour. Label it `bowl`. A bowl is [open|mutable]: you can keep adding things. Spots in the bowl are counted from [0|index 0].",
      "A list is a mutable object. Its items are numbered from 0.",
      st => { st.heap.o1 = { t: "list", items: [P("'egg'"), P("'flour'")] }; g(st).bowl = R("o1"); });
    step(2, "Tie a `mixing` [label|name] to that same [bowl|list object]. There is still only one bowl on the shelf.",
      "`mixing = bowl` is aliasing: two names, one list. No copy is made.",
      st => { g(st).mixing = R("o1"); });
    step(3, "Pour milk into the bowl labeled `mixing`. Now look in the bowl labeled `bowl`: the milk is there, because it's the [same bowl|same object].",
      "`.append()` changes the list in place, so every name that refers to it sees the change.",
      st => { st.heap.o1.items.push(P("'milk'")); });
    step(4, "Take a [second bowl|new list], put the same ingredients in it, and label it `side`.",
      "`.copy()` builds a new list with the same items. `side` refers to a different object.",
      st => { st.heap.o2 = { t: "list", items: JSON.parse(JSON.stringify(st.heap.o1.items)) }; g(st).side = R("o2"); });
    step(5, "Salt goes into the side bowl only.",
      "Changing the copy leaves the original list alone.",
      st => { st.heap.o2.items.push(P("'salt'")); });
    step(6, "[Serve|print] both bowls. Moving a [label|name] never moves food. Only a second bowl gives you a separate batch.",
      "`=` never copies a list. Use `.copy()`, `list(x)` or `x[:]` when you need an independent one.",
      st => { st.out.push("['egg', 'flour', 'milk'] ['egg', 'flour', 'milk', 'salt']"); });
  }),

  lesson({ id: "loops", title: "Weigh each ingredient", topic: "for loops",
    blurb: "A for loop does the same steps once for every item, like weighing ingredients one at a time.",
    code: ['weight = 0', 'for grams in [200, 150, 50]:', '    weight += grams', 'print(weight)'] }, step => {
    step(1, "Zero the kitchen scale and write 0 on a [label|variable] called `weight`. Small numbers are written straight on the label, so they don't need a jar.",
      "`weight` is bound to 0. Small values are drawn inline to keep the picture readable.",
      st => { g(st).weight = P(0, { ico: "⚖️" }); });
    step(2, "Line up flour, butter and chocolate on a [prep tray|list]. [Pick up|the loop takes] the first one: 200 g of flour. The `grams` label now reads 200.",
      "The `for` loop takes item 0 from the list and binds `grams` to it.",
      st => { st.heap.o1 = { t: "list", vessel: "tray", k: "Prep tray", hold: true, hl: 0,
                items: [P(200, { ico: "🌾" }), P(150, { ico: "🧈" }), P(50, { ico: "🍫" })] };
              g(st).grams = P(200, { ico: "🌾" }); });
    step(3, "Put it on the scale: 0 + 200 = 200.",
      "`weight += grams` is shorthand for `weight = weight + grams`.",
      st => { g(st).weight = P(200, { ico: "⚖️" }); });
    step(2, "[Repeat|next iteration] with the next ingredient: 150 g of butter.",
      "Back to the loop header: `grams` is rebound to item 1.",
      st => { st.heap.o1.hl = 1; g(st).grams = P(150, { ico: "🧈" }); });
    step(3, "200 + 150 = 350.",
      "The indented body runs once per item.",
      st => { g(st).weight = P(350, { ico: "⚖️" }); });
    step(2, "The last ingredient: 50 g of chocolate.",
      "Item 2, the final one.",
      st => { st.heap.o1.hl = 2; g(st).grams = P(50, { ico: "🍫" }); });
    step(3, "350 + 50 = 400.",
      "The body runs for the third time.",
      st => { g(st).weight = P(400, { ico: "⚖️" }); });
    step(2, "Nothing left on the tray, so you [stop repeating|the loop ends]. `grams` still shows the last thing you weighed. Nobody needs the tray now, so it goes in the [sink|garbage].",
      "The loop ends when the list runs out. Loop variables keep their last value afterwards. Nothing refers to the list any more.",
      st => { delete st.heap.o1.hl; delete st.heap.o1.hold; });
    step(4, "The sink is [washed up|garbage-collected] and the total weight is [called out|printed].",
      "`print(weight)` outputs 400. The unused list has been garbage-collected.",
      st => { delete st.heap.o1; st.out.push("400"); });
  }),

  lesson({ id: "recipes", title: "Recipe cards", topic: "functions",
    blurb: "A function is a recipe card. Each time you use it, a fresh workstation opens, cooks, and is cleared.",
    code: ['def make_tea(leaf):', '    cup = leaf + " tea"', '    return cup', '', 'order = make_tea("mint")', 'print(order)'] }, step => {
    step(1, "Write a [recipe card|function] and label it `make_tea`. Writing the card doesn't brew anything yet.",
      "`def` creates a function object and binds the name `make_tea` to it. The body does not run yet.",
      st => { st.heap.o1 = { t: "func", v: "make_tea(leaf)" }; g(st).make_tea = R("o1"); });
    step(5, "An order comes in. A cook sets up a fresh [cutting board|frame] for this recipe and labels the mint you handed over `leaf`, the [ingredient the card asks for|parameter].",
      "Calling `make_tea(\"mint\")` creates a new frame. The parameter `leaf` is bound to the argument.",
      st => { st.heap.o2 = { t: "str", v: "'mint'", fill: "🌿🌿🌿" }; st.frames.push({ name: "make_tea", vars: { leaf: R("o2") } }); });
    step(2, "On that board, brew a cup and label it `cup`. This [label|local variable] only exists on this board; the main counter can't see it.",
      "`cup` is a local variable. It lives in the function's frame, not the global frame.",
      st => { st.heap.o3 = { t: "str", v: "'mint tea'", vessel: "cup", k: "Teacup" }; active(st).cup = R("o3"); });
    step(3, "Put the cup on the [plate|return value] to hand back.",
      "`return cup` sets the return value to the object `cup` refers to.",
      st => { active(st).$ret = R("o3"); });
    step(5, "The board is [wiped clean|frame destroyed] and its labels are thrown away. The tea is handed back and gets a new label, `order`. The leftover mint has no label, so it goes in the [sink|garbage].",
      "The frame is destroyed, so `leaf` and `cup` disappear. The returned object survives as `order`. The 'mint' string has no references left.",
      st => { st.frames.pop(); g(st).order = R("o3"); });
    step(6, "The sink is [washed up|garbage-collected] and the tea goes out through the [hatch|print output].",
      "Unreferenced objects are garbage-collected. `print` outputs `mint tea`.",
      st => { delete st.heap.o2; st.out.push("mint tea"); });
  }),

  lesson({ id: "layers", title: "A cake that makes cakes", topic: "recursion",
    blurb: "A recipe that uses itself on a smaller job, until the job is simple enough to do directly.",
    code: ['def cake(layers):', '    if layers == 1:', '        return "base"', '    return cake(layers - 1) + "+layer"', '', 'print(cake(3))'] }, step => {
    step(1, "Write the cake [recipe card|function]. Its last line says: make a cake with one fewer layer, then add a layer on top. The recipe [uses itself|recursion].",
      "Defines a recursive function, one that calls itself.",
      st => { st.heap.o1 = { t: "func", v: "cake(layers)" }; g(st).cake = R("o1"); });
    step(6, "Order in: a 3-layer cake. [Cutting board 1|frame for cake(3)] comes out.",
      "`cake(3)` is called, creating a frame with `layers = 3`.",
      st => { st.frames.push({ name: "cake", vars: { layers: P(3) } }); });
    step(2, "[Check the order|if test]: is this a 1-layer cake? No.",
      "`3 == 1` is False, so `return \"base\"` is skipped.");
    step(4, "Board 1 can't finish until it has a 2-layer cake. It [waits|pauses] and a [second board|new frame] comes out.",
      "`cake(2)` is called. The first frame pauses mid-line and stays on the call stack.",
      st => { st.frames.push({ name: "cake", vars: { layers: P(2) } }); });
    step(2, "Is this a 1-layer cake? Still no.",
      "`2 == 1` is False.");
    step(4, "Board 2 waits too and a third board comes out. Three boards are busy at once, each with its own `layers` [label|local variable].",
      "A third frame. Every call has its own local variables.",
      st => { st.frames.push({ name: "cake", vars: { layers: P(1) } }); });
    step(2, "Board 3 only needs one layer. This is the [easy case|base case].",
      "`1 == 1` is True. This is the base case that stops the recursion.");
    step(3, "Board 3 bakes a sponge base and sets it on its [plate|return value].",
      "`cake(1)` returns `\"base\"`.",
      st => { active(st).$ret = P("'base'", { cake: 1 }); });
    step(4, "Board 3 is [cleared|frame destroyed]. Board 2 takes the base, adds a layer of cream, and plates it.",
      "Back in the `layers = 2` frame: `\"base\" + \"+layer\"`.",
      st => { st.frames.pop(); active(st).$ret = P("'base+layer'", { cake: 2 }); });
    step(4, "Board 2 is cleared. Board 1 adds the final layer.",
      "Back in the `layers = 3` frame, which can finally finish its line.",
      st => { st.frames.pop(); active(st).$ret = P("'base+layer+layer'", { cake: 3 }); });
    step(6, "Every board is put away and the cake goes out the [hatch|print output]. Without the 1-layer rule, boards would keep coming out until the kitchen ran out of counter space.",
      "The stack unwinds and `print` runs. With no base case, Python would stop with `RecursionError`.",
      st => { st.frames.pop(); st.out.push("base+layer+layer"); });
  }),

  lesson({ id: "drawers", title: "The spice cabinet", topic: "dictionaries",
    blurb: "A dictionary looks things up by name instead of by position.",
    code: ['spices = {"salt": 3}', 'spices["pepper"] = 2', 'spices["salt"] -= 1', 'for name, qty in spices.items():', '    print(name, qty)'] }, step => {
    const spoons = n => P(n, { ico: "🥄", rep: n });
    step(1, "A [spice cabinet|dict]. Each drawer has a [name on the front|key] and an [amount inside|value]. No two drawers share a name.",
      "A dict maps unique keys to values.",
      st => { st.heap.o1 = { t: "dict", items: [["'salt'", spoons(3)]] }; g(st).spices = R("o1"); });
    step(2, "Fit a [new drawer|new key] for pepper and put 2 spoons in it.",
      "Assigning to a new key adds an entry.",
      st => { st.heap.o1.items.push(["'pepper'", spoons(2)]); });
    step(3, "Use a spoon of salt. [Same drawer|same key], new amount.",
      "Assigning to an existing key replaces its value. `-=` reads 3 and writes 2.",
      st => { st.heap.o1.items[0][1] = spoons(2); });
    step(4, "[Walk along the drawers|loop over .items()]. At each one, read the [name|key] and the [amount|value] onto two labels.",
      "`.items()` gives (key, value) pairs. The loop unpacks each pair into `name` and `qty`.",
      st => { st.heap.o1.hl = 0; g(st).name = P("'salt'"); g(st).qty = P(2, { ico: "🥄" }); });
    step(5, "[Call it out|print] through the hatch.",
      "Prints the first pair.",
      st => { st.out.push("salt 2"); });
    step(4, "Next drawer.",
      "The second pair.",
      st => { st.heap.o1.hl = 1; g(st).name = P("'pepper'"); g(st).qty = P(2, { ico: "🥄" }); });
    step(5, "Call it out.",
      "Prints the second pair.",
      st => { st.out.push("pepper 2"); });
    step(4, "End of the cabinet. Drawers stay in the [order you fitted them|insertion order].",
      "Dicts keep insertion order, so `salt` came before `pepper`.",
      st => { delete st.heap.o1.hl; });
  }),
];

const GLOSSARY = [
  ["📖", "Recipe", "code"], ["🏷️", "Label", "variable"], ["🧵", "Twine", "reference"], ["🫙", "Sealed jar", "immutable object"],
  ["🥣", "Mixing bowl", "list"], ["🗄️", "Spice cabinet", "dict"], ["📇", "Recipe card", "function"], ["🪵", "Cutting board", "frame"],
  ["🍽️", "Plate", "return value"], ["🛎️", "Serving hatch", "print() output"], ["🚰", "Sink", "garbage collection"],
];

function highlight(src) {
  const re = /("[^"]*"|'[^']*')|\b(def|return|if|for|in|while|else|elif)\b|\b(\d+)\b|\b(print|len|range)\b/g;
  let out = "", last = 0, m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index));
    out += `<span class="${m[1] ? "st" : m[2] ? "kw" : m[3] ? "nu" : "bi"}">${esc(m[0])}</span>`;
    last = re.lastIndex;
  }
  return out + esc(src.slice(last));
}

const ingOf = v => v.ico || INGREDIENT[v.p] || "";

function chipHTML(v) {
  const ing = ingOf(v);
  const pics = v.cake ? `<span class="cake">${"<i></i>".repeat(v.cake)}</span>`
             : ing ? `<span class="ing">${ing.repeat(v.rep || 1)}</span>` : "";
  return `<span class="chip">${pics}<code>${esc(v.p)}</code></span>`;
}
const valHTML = v => v.r ? `<span class="knot" data-to="${v.r}" title="twine to an object on the shelf"></span>` : chipHTML(v);

function reachable(st) {
  const seen = new Set();
  const visit = v => {
    if (!v || !v.r || seen.has(v.r)) return;
    seen.add(v.r);
    const o = st.heap[v.r];
    (o.items || []).forEach(it => visit(o.t === "dict" ? it[1] : it));
  };
  st.frames.forEach(f => Object.values(f.vars).forEach(visit));
  Object.entries(st.heap).forEach(([id, o]) => { if (o.hold) visit(R(id)); });
  return seen;
}

function vesselHTML(o) {
  const vessel = o.vessel || { int: "jar", str: "jar", list: "bowl", dict: "cabinet", func: "card" }[o.t];
  if (vessel === "card") return `<div class="v-card"><span>${esc(o.v)}</span><i></i><i></i><i></i></div>`;
  if (vessel === "cup") return `<div class="v-cup"><div class="tea">🌿</div></div>`;
  if (vessel === "jar") {
    const fill = o.cubes ? `<i class="cube"></i>`.repeat(o.cubes) : `<span class="fill">${o.fill || ""}</span>`;
    return `<div class="v-jar">${fill}</div>`;
  }
  if (vessel === "cabinet") {
    return `<div class="v-cabinet">${o.items.map(([k, v], i) => `<div class="drawer ${o.hl === i ? "on" : ""}">
      <span class="knob"></span><span class="dk"><span class="ing">${INGREDIENT[k] || ""}</span><span>${esc(k)}<small>key</small></span></span>
      ${chipHTML(v)}</div>`).join("")}</div>`;
  }
  return `<div class="v-${vessel}">${o.items.map((v, i) => `<div class="slot ${o.hl === i ? "on" : ""}">
    <span class="ing">${ingOf(v) || "·"}</span><span class="sv">${esc(v.p)}</span><span class="si">[${i}]</span></div>`).join("")}</div>`;
}

function objHTML(id, o, changed) {
  const [kname, pyname] = KIND[o.t];
  const showVal = o.t === "int" || o.t === "str";
  const hold = o.hold ? `<span class="tag">${term("on the counter", "being looped over")}</span>` : "";
  return `<div class="obj" id="obj-${id}">
    <div class="spot ${changed ? "changed" : ""}">${vesselHTML(o)}</div>
    <div class="cap">${showVal ? `<span class="val">${esc(o.v)}</span>` : ""}${term(o.k || kname, pyname)}${hold}</div>
  </div>`;
}

let L = LESSONS[0], i = 0, timer = null;

function render() {
  const step = L.steps[i], prev = i > 0 ? L.steps[i - 1].st : null, st = step.st;

  $("#ltitle").textContent = L.title;
  $("#lblurb").textContent = L.blurb;
  $("#code").innerHTML = L.code.map((src, n) =>
    `<li class="${step.line === n + 1 ? "cur" : ""}"><span class="ln">${n + 1}</span><span>${highlight(src) || " "}</span></li>`).join("");
  $("#nk").innerHTML = fmt(step.k);
  $("#npy").innerHTML = fmt(step.py);

  const multi = st.frames.length > 1;
  $("#stations").innerHTML = st.frames.map((f, fi) => {
    const pf = prev && prev.frames[fi] && prev.frames[fi].name === f.name ? prev.frames[fi] : null;
    const rows = Object.entries(f.vars).map(([name, v]) => {
      const changed = prev && (!pf || JSON.stringify(pf.vars[name]) !== JSON.stringify(v));
      const left = name === "$ret"
        ? `<span class="plate-row"><span class="plate"></span>${term("Plate", "return value")}</span>`
        : `<span class="lab"><span class="tape">${esc(name)}</span><span class="tp">variable</span></span>`;
      return `<div class="var ${changed ? "changed" : ""}">${left}${valHTML(v)}</div>`;
    }).join("");
    const isActive = fi === st.frames.length - 1;
    const title = fi === 0 ? term("Main counter", "global frame") : term(`Cutting board ${fi}`, `frame: ${esc(f.name)}()`);
    const state = !multi ? "" : isActive ? term("cooking", "running") : term("waiting", "paused");
    return `<div class="board ${multi ? (isActive ? "working" : "waiting") : ""}">
      <div class="bhead">${title}<span class="state">${state}</span></div>
      ${rows || `<p class="empty-note">No labels yet</p>`}</div>`;
  }).join("");

  const live = reachable(st);
  const ids = Object.keys(st.heap);
  const isChanged = id => prev && JSON.stringify(prev.heap[id]) !== JSON.stringify(st.heap[id]);
  const onShelf = ids.filter(id => live.has(id)), inSink = ids.filter(id => !live.has(id));
  $("#shelf").innerHTML = onShelf.length ? onShelf.map(id => objHTML(id, st.heap[id], isChanged(id))).join("")
    : `<div class="empty">Nothing on the shelf yet</div>`;
  $("#basin").innerHTML = inSink.length ? inSink.map(id => objHTML(id, st.heap[id], false)).join("")
    : `<span class="note-s">Empty</span>`;

  $("#out").innerHTML = st.out.length
    ? st.out.map((line, n) => `<div class="ticket ${prev && n >= prev.out.length ? "changed" : ""}"><small>Order ${n + 1}</small>${esc(line)}</div>`).join("")
    : `<p class="empty-note">Nothing served yet</p>`;

  const last = L.steps.length - 1;
  $("#count").textContent = `Step ${i} of ${last}`;
  $("#scrub").max = last; $("#scrub").value = i;
  $("#b-first").disabled = $("#b-prev").disabled = i === 0;
  $("#b-next").disabled = i === last;
  $("#b-next").textContent = i === 0 ? "Start cooking" : "Next step";
  $("#b-play").textContent = timer ? "Pause" : "Play";
  document.querySelectorAll("#lessons button").forEach(b => b.setAttribute("aria-pressed", b.dataset.id === L.id));

  requestAnimationFrame(drawStrings);
}

function drawStrings() {
  const scene = $("#scene"), svg = $("#strings"), sr = scene.getBoundingClientRect();
  svg.setAttribute("viewBox", `0 0 ${sr.width} ${sr.height}`);
  svg.setAttribute("width", sr.width); svg.setAttribute("height", sr.height);
  let paths = "";
  scene.querySelectorAll(".knot[data-to]").forEach(k => {
    const obj = document.getElementById("obj-" + k.dataset.to);
    if (!obj) return;
    const a = k.getBoundingClientRect(), b = obj.getBoundingClientRect();
    const sx = a.left + a.width / 2 - sr.left, sy = a.top + a.height / 2 - sr.top;
    const tx = b.left + b.width / 2 - sr.left, ty = b.bottom - sr.top;
    const dy = Math.max(40, Math.abs(sy - ty) / 2);
    const p = `M${sx},${sy} C${sx},${sy - dy} ${tx},${ty + dy} ${tx},${ty + 4}`;
    paths += `<path class="s${k.closest(".changed") ? " new" : ""}" d="${p}" marker-end="url(#knot-end)"/>`;
  });
  svg.innerHTML = `<defs><marker id="knot-end" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>${paths}`;
}

function go(n) { i = Math.max(0, Math.min(L.steps.length - 1, n)); render(); }
function stop() { clearInterval(timer); timer = null; }
function pick(id) {
  stop();
  L = LESSONS.find(l => l.id === id) || LESSONS[0];
  i = 0;
  try { localStorage.setItem("pk-lesson", L.id); } catch (e) {}
  render();
}

$("#glossary").innerHTML = GLOSSARY.map(([ico, k, py]) => `<span class="gl"><span class="ico">${ico}</span>${term(k, py)}</span>`).join("");
$("#recipe-head").innerHTML = term("The recipe", "your code");
$("#shelf-head").innerHTML = term("The shelf", "objects in memory");
$("#counter-head").innerHTML = term("The countertop", "frames (the call stack)");
$("#sink-head").innerHTML = term("Sink", "garbage collection");
$("#hatch-head").innerHTML = `${term("Serving hatch 🛎️", "print() output")}`;
$("#lessons").innerHTML = LESSONS.map((l, n) =>
  `<button type="button" data-id="${l.id}" aria-pressed="false"><span class="n">${n + 1}</span>${term(esc(l.title), esc(l.topic))}</button>`).join("");

$("#lessons").addEventListener("click", e => { const b = e.target.closest("button"); if (b) pick(b.dataset.id); });
$("#b-first").onclick = () => { stop(); go(0); };
$("#b-prev").onclick = () => { stop(); go(i - 1); };
$("#b-next").onclick = () => { stop(); go(i + 1); };
$("#b-play").onclick = () => {
  if (timer) { stop(); render(); return; }
  if (i === L.steps.length - 1) i = 0;
  timer = setInterval(() => { if (i >= L.steps.length - 1) { stop(); render(); } else go(i + 1); }, 2200);
  render();
};
$("#scrub").oninput = e => { stop(); go(+e.target.value); };
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "ArrowRight") { stop(); go(i + 1); }
  if (e.key === "ArrowLeft") { stop(); go(i - 1); }
});
