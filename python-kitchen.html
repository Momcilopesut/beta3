<title>Python Kitchen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: left column = ticket printer (the code) + "your move" choices; right = a 2D restaurant kitchen drawn in SVG
   (steel racks = memory, prep counter with cutting boards = frames, dish sink = garbage collection, the pass = output).
   A recipe book overlay lists the dishes by difficulty. Every kitchen word carries its Python word underneath in blue. */
:root {
  --bg: #e2e7e8; --panel: #ffffff; --ink: #1c2629; --muted: #5b6a6e; --line: #ccd6d8;
  --py: #2350c4;
  --good: #23824a; --good-bg: #e3f4e8; --bad: #b8382a; --bad-bg: #fbe7e4;
  --hl-bg: #fff2b8; --hl-edge: #e0b414;
  --wall: #f6f8f8; --grout: #dbe2e3;
  --steel: #d5dcdf; --steel-mid: #b9c3c7; --steel-dark: #84929a; --steel-hi: #eef2f3;
  --board: #e2bf8c; --board-edge: #a87a45; --board-ink: #3b2610;
  --glass: rgba(205, 228, 242, .55); --glass-edge: #86a7bf;
  --lid: #c4503b; --lid-dark: #93372a;
  --paper: #fffdf5; --paper-edge: #d8d2bf;
  --china: #ffffff; --china-edge: #b9c3c8; --tea: #a46d2a;
  --wood: #c99a62; --wood-dark: #8e6436;
  --basin: #a3afb5; --opening: #34302c; --opening-ink: #e9e1d4;
  --lamp: #c4503b; --glow: rgba(255, 170, 60, .35);
  --tape: #f1dfa8; --tape-ink: #3d3214; --twine: #8f5a1e;
  --sponge: #e8b66c; --cream: #f6d8e2;
  --alarm: #d6402f;
  --printer: #2d3337; --printer-ink: #cfd7da;
  --flash: rgba(240, 196, 30, .55);
  --book: #7b2d26; --book-page: #fbf6ea; --book-ink: #2a2118; --book-line: #e3d8bf;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --hand: "Kalam", "Segoe Print", "Comic Sans MS", cursive;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1517; --panel: #172024; --ink: #e3ebed; --muted: #97a7ab; --line: #2b383c; --py: #8cb0ff;
  --good: #5fd08a; --good-bg: #173726; --bad: #ff8a7a; --bad-bg: #3d1d19;
  --hl-bg: #3b3313; --hl-edge: #f0c93c;
  --wall: #1e2729; --grout: #283336; --steel: #4b575d; --steel-mid: #3d484d; --steel-dark: #2a3337; --steel-hi: #5d6a70;
  --board: #8a6639; --board-edge: #5e4322; --board-ink: #fbeedb;
  --glass: rgba(140, 180, 210, .2); --glass-edge: #6488a3; --lid: #d4614b; --lid-dark: #9c3f2f;
  --paper: #f3eedf; --paper-edge: #b9b29c; --china: #e9eef0; --china-edge: #9aa6ad; --tea: #b67c35;
  --wood: #7d5a32; --wood-dark: #563c1f; --basin: #2a3439; --opening: #0b0a09; --opening-ink: #d8d0c2;
  --lamp: #d4614b; --glow: rgba(255, 170, 60, .22);
  --tape: #dcc88f; --tape-ink: #2b2208; --twine: #e2ad66; --flash: rgba(240, 201, 60, .4);
  --printer: #0c1012; --printer-ink: #a9b4b8;
  --book: #5c1f1a; --book-page: #f1ead9; --book-ink: #2a2118; --book-line: #d9ccb0;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0f1517; --panel: #172024; --ink: #e3ebed; --muted: #97a7ab; --line: #2b383c; --py: #8cb0ff;
  --good: #5fd08a; --good-bg: #173726; --bad: #ff8a7a; --bad-bg: #3d1d19;
  --hl-bg: #3b3313; --hl-edge: #f0c93c;
  --wall: #1e2729; --grout: #283336; --steel: #4b575d; --steel-mid: #3d484d; --steel-dark: #2a3337; --steel-hi: #5d6a70;
  --board: #8a6639; --board-edge: #5e4322; --board-ink: #fbeedb;
  --glass: rgba(140, 180, 210, .2); --glass-edge: #6488a3; --lid: #d4614b; --lid-dark: #9c3f2f;
  --paper: #f3eedf; --paper-edge: #b9b29c; --china: #e9eef0; --china-edge: #9aa6ad; --tea: #b67c35;
  --wood: #7d5a32; --wood-dark: #563c1f; --basin: #2a3439; --opening: #0b0a09; --opening-ink: #d8d0c2;
  --lamp: #d4614b; --glow: rgba(255, 170, 60, .22);
  --tape: #dcc88f; --tape-ink: #2b2208; --twine: #e2ad66; --flash: rgba(240, 201, 60, .4);
  --printer: #0c1012; --printer-ink: #a9b4b8;
  --book: #5c1f1a; --book-page: #f1ead9; --book-ink: #2a2118; --book-line: #d9ccb0;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--body); }
.wrap { max-width: 1480px; margin: 0 auto; padding-inline: 18px; padding-block: 20px 48px; display: grid; gap: 14px; }

.term { display: inline-flex; flex-direction: column; line-height: 1.15; vertical-align: middle; }
.term .tk { font-weight: 600; }
.term .tp { font: 500 11px/1.3 var(--mono); color: var(--py); }
ruby { ruby-position: under; }
rt { font: 500 10.5px var(--mono); color: var(--py); padding-top: 1px; }

header.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
h1 { font: 800 clamp(26px, 4vw, 38px)/1.05 var(--display); margin: 0; }
.sub { margin: 0; color: var(--muted); flex: 1 1 340px; }
.book-btn { display: inline-flex; align-items: center; gap: 10px; padding: 9px 16px 9px 12px; border-radius: 10px; cursor: pointer;
  background: var(--book); color: #fbefe0; border: none; font: 600 14px/1.2 var(--body); text-align: left; }
.book-btn .tp { color: #f6cdbf; }
.book-btn .ico { font-size: 22px; }

.stage { display: grid; grid-template-columns: minmax(320px, 400px) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 1040px) { .stage { grid-template-columns: minmax(0, 1fr); } }
.col { display: grid; gap: 12px; min-width: 0; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; min-width: 0; }

/* ticket printer = code */
.printer { background: var(--printer); color: var(--printer-ink); border-radius: 16px 16px 8px 8px; padding: 12px 14px 0; }
.printer-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 12px; }
.printer-top .term .tp { color: #9fbaff; }
.led { width: 9px; height: 9px; border-radius: 50%; background: #3ad16b; box-shadow: 0 0 8px #3ad16b; display: inline-block; margin-right: 6px; }
.slot { height: 10px; margin: 10px 4px 0; border-radius: 5px 5px 0 0; background: #000; }
.ticket { margin: 0 18px; background: #fffdf6; color: #23211b; padding: 12px 14px 22px; font: 13px/1.5 var(--mono);
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - 8px), 95% 100%, 90% calc(100% - 8px), 85% 100%, 80% calc(100% - 8px), 75% 100%, 70% calc(100% - 8px), 65% 100%, 60% calc(100% - 8px), 55% 100%, 50% calc(100% - 8px), 45% 100%, 40% calc(100% - 8px), 35% 100%, 30% calc(100% - 8px), 25% 100%, 20% calc(100% - 8px), 15% 100%, 10% calc(100% - 8px), 5% 100%, 0 calc(100% - 8px));
  box-shadow: 0 4px 10px rgba(0,0,0,.15); overflow-x: auto; }
.ticket .th { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #6b665a;
  border-bottom: 1.5px dashed #c9c2ad; padding-bottom: 6px; margin-bottom: 6px; }
.ticket .dish { font: 700 15px/1.3 var(--body); color: #23211b; margin: 2px 0 8px; }
.ticket ol { list-style: none; margin: 0; padding: 0; }
.ticket li { display: flex; white-space: pre; padding: 1px 6px 1px 0; border-left: 4px solid transparent; }
.ticket li .ln { width: 28px; flex: none; text-align: right; padding-right: 8px; color: #8f8a7a; }
.ticket li.next { background: #fff0a8; border-left-color: #e0b414; }
.ticket li.next .ln { color: #23211b; font-weight: 700; }
.ticket li.printing { animation: print .3s steps(4) both; }
@keyframes print { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
@media (prefers-reduced-motion: reduce) { .ticket li.printing { animation: none; } }
.ticket .kw { color: #7b3fb5; font-weight: 600; } .ticket .st { color: #2c7a4b; } .ticket .nu { color: #b4521a; } .ticket .bi { color: #2350c4; }
.printer, .ticket { min-width: 0; }
.needs { margin: 0 0 8px; border-bottom: 1.5px dashed #c9c2ad; padding-bottom: 8px; font-family: var(--body); }
.needs summary { cursor: pointer; font: 600 11px/1.4 var(--body); letter-spacing: .08em; text-transform: uppercase; color: #6b665a; }
.needs summary span { letter-spacing: 0; }
.needs ul { list-style: none; margin: 6px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(138px, 1fr)); gap: 6px 10px; }
.ticket .needs li { display: flex; gap: 6px; align-items: flex-start; min-width: 0; white-space: normal; border-left: none; padding: 0; }
.needs .ne { font-size: 16px; line-height: 1.2; flex: none; }
.needs .term { min-width: 0; }
.needs .tk { font: 600 12px/1.25 var(--body); color: #23211b; }
.needs .tp { font: 500 10.5px/1.3 var(--mono); color: #2350c4; overflow-wrap: anywhere; }
.ticket .src { flex: 1 1 auto; min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.peek { flex: none; margin-left: 8px; width: 26px; height: 22px; padding: 0; border-radius: 6px; border: 1px solid #d8d1bd; background: #f6f1e3;
  cursor: pointer; font-size: 12px; line-height: 1; align-self: center; }
.peek:hover, .peek[aria-expanded="true"] { background: #23211b; border-color: #23211b; }
.ticket li.bd-row { display: block; white-space: normal; padding: 0; border: none; }
.bd { margin: 6px 0 10px; border: 1.5px solid #23211b; border-radius: 8px; background: #fff; font: 13.5px/1.45 var(--body); color: #23211b; overflow: hidden; }
.bd-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 10px; background: #23211b; color: #fffdf6; }
.bd-close { font: 500 12px var(--body); padding: 4px 9px; border-radius: 6px; border: 1px solid #6b665a; background: transparent; color: #fffdf6; cursor: pointer; }
.bd-lbl { display: block; font: 600 10.5px/1 var(--body); letter-spacing: .12em; text-transform: uppercase; color: #6b665a; margin-bottom: 6px; }
.bd-pat { padding: 10px; border-bottom: 1px dashed #d8d1bd; }
.bd-pat code { font: 600 13px var(--mono); background: #f1ecdd; padding: 2px 6px; border-radius: 4px; }
.bd-pat p { margin: 6px 0 0; }
.bd-strip { display: flex; flex-wrap: wrap; gap: 4px; padding: 10px; border-bottom: 1px dashed #d8d1bd; }
.tok { position: relative; display: inline-flex; align-items: center; gap: 4px; font: 600 13px var(--mono); padding: 3px 7px 3px 4px; border-radius: 5px; border: 1.5px solid; white-space: pre; }
.tok i { font: 600 9.5px var(--body); font-style: normal; min-width: 15px; height: 15px; border-radius: 8px; display: grid; place-items: center; color: #fff; padding: 0 3px; }
.c-kw { color: #6a32a3; border-color: #c9b0e6; background: #f6f0fc; } .c-kw i { background: #6a32a3; }
.c-name { color: #1f4bb8; border-color: #b6c8f0; background: #eff4fe; } .c-name i { background: #1f4bb8; }
.c-call { color: #0d6e74; border-color: #a7d8db; background: #ebf8f8; } .c-call i { background: #0d6e74; }
.c-lit { color: #2c7a4b; border-color: #b4dcc2; background: #effaf2; } .c-lit i { background: #2c7a4b; }
.c-op { color: #b4521a; border-color: #ecc5ad; background: #fdf3ec; } .c-op i { background: #b4521a; }
.c-punc, .c-ws { color: #4d4a40; border-color: #d8d1bd; background: #f6f3ea; } .c-punc i, .c-ws i { background: #6b665a; }
.bd-list { list-style: none; margin: 0; padding: 4px 14px 4px 10px; display: grid; }
.bd-list li { white-space: normal; border-left: none; display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 10px; align-items: start; padding: 8px 0; border-bottom: 1px solid #efe9d8; }
.bd-list li:last-child { border-bottom: none; }
.bd-list p { margin: 2px 0 0; }
.bd-list .tok { max-width: 100%; white-space: pre-wrap; overflow-wrap: anywhere; }
.bd-role { font-size: 13px; }
.bd-kit { color: #6e4a1f; }
.bd code, .bd-kitchen code { font: 12.5px var(--mono); background: #f1ecdd; padding: 0 4px; border-radius: 4px; }
.bd-kitchen { padding: 10px; background: #f6ead2; border-top: 1px dashed #d8d1bd; }
.bd-kitchen p { margin: 2px 0; }
.bd-py { font: 500 12px var(--mono); color: #1f4bb8; }
.bd-note { color: #6b665a; font-size: 12.5px; }
.bd summary { cursor: pointer; font-weight: 600; color: #6e4a1f; }
.ticket .foot { margin-top: 8px; border-top: 1.5px dashed #c9c2ad; padding-top: 6px; font-size: 11px; color: #6b665a; display: flex; justify-content: space-between; gap: 8px; }

/* your move */
.move h2 { font: 600 19px/1.2 var(--display); margin: 0; }
.move .q { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
.move .stat { font: 12px var(--mono); color: var(--muted); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.opts { display: grid; gap: 8px; }
/* each answer is a flash card: the front is the kitchen action, the back is the line of code it produces */
.opt-card { position: relative; perspective: 1000px; }
.opt { display: grid; width: 100%; padding: 0; border: none; background: none; color: var(--ink); cursor: pointer; text-align: left;
  font: 500 14.5px/1.35 var(--body); transform-style: preserve-3d; transition: transform .55s cubic-bezier(.3,1.35,.5,1); border-radius: 10px; }
.opt-card.flipped .opt { transform: rotateY(180deg); }
.face { grid-area: 1 / 1; display: grid; gap: 3px; align-content: start; padding: 11px 48px 11px 13px; border-radius: 10px;
  border: 1.5px solid var(--line); background: var(--panel); backface-visibility: hidden; -webkit-backface-visibility: hidden; min-width: 0; }
.face.back { transform: rotateY(180deg); background: var(--board); border-color: var(--board-edge); color: var(--board-ink); align-content: center; }
.face.back .cmp-l { color: var(--board-ink); opacity: .8; margin-top: 0; }
.face.back .tap { font-size: 12px; opacity: .75; }
.opt .face code.line { background: #fffdf6; color: #23211b; padding: 5px 9px; font-size: 13.5px; border-color: #d8d1bd; }
.opt .face code.line.bad { border-color: var(--bad); }
.face.back .op { color: var(--board-ink); opacity: .85; }
.opt:hover:not(:disabled) .face { border-color: var(--ink); }
.opt:focus-visible { outline: none; }
.opt:focus-visible .face { outline: 3px solid var(--hl-edge); outline-offset: 2px; }
.opt .op { font: 500 12px/1.3 var(--mono); color: var(--py); }
.opt.wrong { cursor: default; }
.opt.wrong .face.front { border-color: var(--bad); background: var(--bad-bg); }
.opt.wrong .why { color: var(--bad); font-size: 13px; font-weight: 500; }
.flip { position: absolute; top: 8px; right: 8px; z-index: 2; width: 34px; height: 26px; padding: 0; border-radius: 7px; cursor: pointer;
  border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); font: 700 11px/1 var(--mono); }
.flip:hover, .flip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
@media (prefers-reduced-motion: reduce) { .opt { transition: none; } }
.cmp { display: grid; gap: 3px; margin-top: 6px; }
.cmp-l { font: 600 10.5px/1.2 var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
code.line { display: block; font: 500 13px/1.5 var(--mono); background: #fffdf6; color: #23211b; border: 1px solid #d8d1bd; border-radius: 6px;
  padding: 5px 9px; white-space: pre-wrap; overflow-wrap: anywhere; }
code.line.bad { border-color: var(--bad); }
code.line .kw { color: #7b3fb5; font-weight: 600; } code.line .st { color: #2c7a4b; } code.line .nu { color: #b4521a; }
code.line .bi { color: #2350c4; } code.line .cm { color: #8f8a7a; font-style: italic; }
code.line .dif { background: #fbd9d3; box-shadow: 0 0 0 1px #b8382a; border-radius: 3px; }
.fb.ok code.line { margin: 2px 0; }
.opt.hint .face { border-color: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 30%, transparent); }
.opt code, .fb code { font: 12.5px var(--mono); background: color-mix(in srgb, currentColor 11%, transparent); padding: 0 4px; border-radius: 4px; }
.shake { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-5px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-3px); } }
@media (prefers-reduced-motion: reduce) { .shake { animation: none; } }
.tools { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.tools button, .done button { font: 500 13.5px/1 var(--body); padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
.done button.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 600; }
button:focus-visible { outline: 3px solid var(--hl-edge); outline-offset: 2px; }

.fb { border-radius: 10px; padding: 11px 13px; display: grid; gap: 8px; }
.fb.k { background: var(--board); color: var(--board-ink); border: 1px solid var(--board-edge); }
.fb.k p { line-height: 2.25; margin: 0; }
.fb.k rt { color: var(--board-ink); opacity: .85; font-weight: 600; }
.fb .lbl { font: 600 11px/1 var(--body); text-transform: uppercase; letter-spacing: .12em; opacity: .75; }
.fb.ok { background: var(--good-bg); border: 1px solid var(--good); }
.fb.ok .lbl { color: var(--good); opacity: 1; }
.fb p { margin: 0; }

.done { text-align: center; display: grid; gap: 10px; justify-items: center; }
.done .stars { font-size: 34px; letter-spacing: 4px; }
.done .stars .off { opacity: .2; }
.done .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }

/* cartoon animations (1–2 s) */
[class*="anim-"], .chef, .chef-face, .bubble, .bit { transform-box: fill-box; }
.anim-drop { transform-origin: 50% 100%; animation: drop .8s cubic-bezier(.25,1.2,.5,1) both; }
@keyframes drop { 0% { transform: translateY(-170px) scale(.9); opacity: 0; } 50% { transform: translateY(0) scale(1.14, .84); opacity: 1; } 72% { transform: scale(.94, 1.07); } 100% { transform: none; } }
.anim-pop { transform-origin: 50% 100%; animation: pop .65s ease-out both; }
@keyframes pop { 30% { transform: scale(1.16, .86); } 60% { transform: scale(.95, 1.06); } 100% { transform: none; } }
.anim-sink { transform-origin: 50% 50%; animation: tumble 1s cubic-bezier(.5,0,.7,1) both; }
@keyframes tumble { 0% { transform: translate(-320px, -420px) rotate(-220deg); opacity: 0; } 12% { opacity: 1; } 85% { transform: translate(0, 10px) rotate(10deg); } 100% { transform: none; } }
.anim-slide { transform-origin: 0 100%; animation: slide .7s cubic-bezier(.25,1.3,.5,1) both; }
@keyframes slide { 0% { transform: translateX(-160px) rotate(-8deg); opacity: 0; } 100% { transform: none; opacity: 1; } }
.anim-out { transform-origin: 50% 100%; animation: out .9s ease-in forwards; }
@keyframes out { 0% { opacity: 1; } 30% { transform: translateY(-14px) rotate(-3deg); } 100% { transform: translate(90px, 170px) rotate(16deg); opacity: 0; } }
.anim-slap { transform-origin: 10% 50%; animation: slap .5s cubic-bezier(.3,1.6,.5,1) both; }
@keyframes slap { 0% { transform: scale(1.7) rotate(-12deg); opacity: 0; } 100% { transform: none; opacity: 1; } }
.anim-ticket { transform-origin: 50% 0; animation: ticket .7s cubic-bezier(.25,1.5,.5,1) both; }
@keyframes ticket { 0% { transform: translateY(-90px) rotate(-6deg); opacity: 0; } 100% { transform: none; opacity: 1; } }
.anim-ring { transform-origin: 50% 0; animation: ring .14s ease-in-out 7 alternate; }
@keyframes ring { from { transform: rotate(-20deg); } to { transform: rotate(20deg); } }
.knot-run { fill: var(--twine); stroke: #fff; stroke-width: 2; animation: fadeout .25s .7s forwards; }
.twine.new { animation: fadein .35s .45s both; }
@keyframes fadein { from { opacity: 0; } }
@keyframes fadeout { to { opacity: 0; } }
.chef { transform-origin: 50% 100%; animation: chef 1.9s cubic-bezier(.3,1.25,.5,1) both; }

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const term = (k, py) => `<span class="term"><span class="tk">${k}</span><span class="tp">${py}</span></span>`;
const code = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
const fmt = s => code(s).replace(/\[([^\]|]+)\|([^\]]+)\]/g, "<ruby>$1<rt>$2</rt></ruby>");

const INGREDIENT = { "'bread'": "🍞", "'ham'": "🍖", "'cheese'": "🧀", "'tomato'": "🍅", "'margherita'": "🍕", "'egg'": "🥚", "'flour'": "🌾", "'milk'": "🥛", "'salt'": "🧂", "'mint'": "🌿", "'pepper'": "🌶️" };
const P = (v, opt = {}) => ({ p: String(v), ...opt });
const R = id => ({ r: id });
const g = st => st.frames[0].vars;
const active = st => st.frames[st.frames.length - 1].vars;

const KIND = {
  int: ["Sealed jar", "int object"], str: ["Sealed jar", "str object"], list: ["Mixing bowl", "list object"],
  dict: ["Spice cabinet", "dict object"], func: ["Recipe card", "function object"],
  class: ["Blueprint", "class object"], obj: ["Oven", "Oven instance (object)"],
};

/* A dish is a program. Each step: the line it runs, the right action [kitchen, python], wrong actions [kitchen, python, why],
   then the explanation shown once you get it right (kitchen with [word|python] notes, then Python). */
function dish(meta, script) {
  const steps = [];
  let st = { frames: [{ name: "global", vars: {} }], heap: {}, out: [] };
  const step = (line, right, wrong, k, py, fn) => {
    st = JSON.parse(JSON.stringify(st));
    if (fn) fn(st);
    const o = { line, right, wrong, k, py, st };
    steps.push(o);
    return o;
  };
  steps.push({ line: null, st: JSON.parse(JSON.stringify(st)) });
  script(step);
  // a fourth answer for every step: one more wrong move, in step order
  (EXTRA[meta.id] || []).forEach((w, j) => { if (steps[j + 1]) steps[j + 1].wrong.push(w); });
  return { ...meta, steps };
}

/* The third wrong answer for each step, listed in the order the steps happen.
   Each is [kitchen action, Python meaning, why it's wrong, the line of code it would be]. */
const ANS = (k, p, why, c) => [k, p, why, c];
const SAY_NAME = (name, val) => ANS(`Shout "${name}"`, "print the name as text", `With quotes it's just the word. Without them, the value (${val}) is printed.`, `print("${name}")`);
const EXTRA = {
  toast: [
    ANS("Label the bread `Slices`", "capital letters don't matter", "Names are case-sensitive: `Slices` and `slices` are two different labels.", "Slices = 2"),
    ANS("Send \"2 2 slices of bread\"", "print repeats the value", "`print` shows each value it's given once.", 'print(slices, slices, "slices of bread")'),
  ],
  sugar: [
    ANS("Fill the jar with the word \"5\"", "a string, not a number", "Quotes make the text '5'. Text can't be added to like a number.", 'sugar = "5"'),
    ANS("Tie `backup` to an empty jar", "backup starts empty", "`backup = sugar` ties it to whatever `sugar` points at: the 5.", "backup = None"),
    ANS("Fill the new jar with \"51\"", "+ joins like text", "`sugar` is a number, so `+ 1` adds. Joining only happens with strings.", 'sugar = str(sugar) + "1"'),
    ANS("Send \"sugar cubes and backup cubes\"", "print the names as text", "With quotes they're just words. Without them, the values (6 and 5) are printed.", 'print("sugar", "cubes and", "backup", "cubes")'),
  ],
  pizza: [
    ANS("Write the label in quotes: `\"pizza\"`", "a string as the name", "Quotes make a value, not a label. Assigning to a string is a SyntaxError.", '"pizza" = "margherita"'),
    ANS("Send \"One, margherita, pizza\"", "commas get printed", "The commas only separate values in the code; `print` shows spaces.", 'print("One,", pizza + ",", "pizza")'),
  ],
  lemonade: [
    ANS("Put 3 lemons in a crate labeled `Lemons`", "names ignore case", "Names are case-sensitive; the ticket uses lowercase `lemons`.", "Lemons = 3"),
    ANS("Set out 33 glasses", "* repeats like text", "`lemons` is a number, so `*` multiplies. Repeating only happens with strings.", "glasses = int(str(lemons) * 2)"),
    ANS("Pour \"ade\" first: \"adelemon\"", "+ order doesn't matter", "String `+` keeps the order you write: left side first.", 'drink = "ade" + "lemon"'),
    ANS("Send \"6glasses oflemonade\"", "no space between values", "`print` puts a space between values for you.", 'print(str(glasses) + "glasses of" + drink)'),
  ],
  egg: [
    ANS("Set the timer to the text \"8\"", "a string", "Quotes make text; comparing `\"8\" > 6` is a TypeError.", 'minutes = "8"'),
    ANS("Check whether 8 equals 6", "== instead of >", "The ticket compares with `>`, greater than.", "if minutes == 6:"),
    ANS("Write \"hard\" on the timer label", "overwrite minutes", "The ticket assigns to `egg`, a new label. `minutes` stays 8.", 'minutes = "hard"'),
    ANS("Send \"egg boiled egg\"", "print the name as text", "With quotes it's just the word. Without them, the value (hard) is printed.", 'print("egg", "boiled egg")'),
  ],
  pancakes: [
    ANS("Mash flour and egg into one lump: \"flouregg\"", "join the strings", "The comma separates two items; nothing is joined.", 'batter = ["flour" + "egg"]'),
    ANS("Pour milk into a bowl of its own", "make a new list", "`append` adds to `batter`; nothing new is made.", 'milk = ["milk"]'),
    ANS("Count the letters in the bowl", "len counts characters", "`len` of a list counts its items, not letters.", 'size = len("flouregg" + "milk")'),
    ANS("Send \"Batter with size ingredients\"", "print the name as text", "With quotes it's just the word. Without them, the value (3) is printed.", 'print("Batter with", "size", "ingredients")'),
  ],
  cookies: [
    ANS("Write \"0\" as text on the scale", "a string", "Text can't be added to numbers: `\"0\" + 200` is a TypeError.", 'weight = "0"'),
    ANS("Pick up the chocolate first", "loops go backwards", "A for loop goes from the first item to the last.", "grams = 50"),
    ANS("Add the flour twice", "double it", "One pass adds the item once.", "weight += grams * 2"),
    ANS("Pick up the flour again", "the loop repeats an item", "Each pass moves on to the next item.", "grams = 200"),
    ANS("Take the butter off the scale", "-= instead of +=", "`+=` adds.", "weight -= grams"),
    ANS("Skip the chocolate", "the loop skips the last item", "A for loop visits every item, including the last.", "continue"),
    ANS("Write 50 after the total: \"35050\"", "join as text", "Both are numbers, so `+=` adds them: 350 + 50.", "weight = str(weight) + str(grams)"),
    ANS("Throw away the `grams` label", "the loop variable is deleted", "After a for loop, the loop variable keeps its last value.", "del grams"),
    ANS("Send \"weight g of cookie dough\"", "print the name as text", "With quotes it's just the word. Without them, the value (400) is printed.", 'print("weight", "g of cookie dough")'),
  ],
  soup: [
    ANS("Write \"20\" as text", "a string", "`\"20\" < 100` is a TypeError: text can't be compared with numbers.", 'temp = "20"'),
    ANS("Check: is 20° above 100°?", "> instead of <", "The ticket checks `<`: below.", "while temp > 100:"),
    ANS("Cool it to -20°", "subtract", "`+` adds 40: 20 + 40 = 60.", "temp = temp - 40"),
    ANS("Keep heating without checking", "the check only runs once", "A while loop re-checks before every pass.", "temp = temp + 40"),
    ANS("Heat it to 60 + 60 = 120°", "add temp to itself", "The ticket adds 40, not `temp`.", "temp = temp + temp"),
    ANS("Check: is it exactly 100°? Yes, keep heating", "== instead of <", "The test is `<`, not `==`.", "while temp == 100:"),
    ANS("Send \"Soup at temp degrees\"", "print the name as text", "With quotes it's just the word. Without them, the value (100) is printed.", 'print("Soup at", "temp", "degrees")'),
  ],
  tea: [
    ANS("Write a card with no ingredient slot", "no parameter", "The card asks for `leaf`; without it, `make_tea(\"mint\")` fails with TypeError.", "def make_tea():"),
    ANS("Open the board but label the mint `mint`", "name the parameter after the value", "The parameter's name comes from the card: `leaf`.", 'mint = "mint"'),
    ANS("Brew \"minttea\" with no space", "drop the space", "The ticket's string is `\" tea\"`, with a leading space.", 'cup = leaf + "tea"'),
    ANS("Put the mint on the plate instead", "return the argument", "The ticket returns `cup`, the tea.", "return leaf"),
    ANS("Label the returned tea `cup` on the main board", "keep the local name", "Local names vanish with the board. The ticket names it `order`.", 'cup = make_tea("mint")'),
    SAY_NAME("order", "mint tea"),
  ],
  bowls: [
    ANS("Put egg and flour in a spice cabinet", "a dict", "Curly braces with keys make a dict; square brackets make a list.", 'sweet = {"egg": 1, "flour": 1}'),
    ANS("Tie `mixing` to the egg only", "alias the first item", "`mixing = sweet` ties it to the whole bowl.", "mixing = sweet[0]"),
    ANS("Pour the milk in at the front", "insert at 0", "`append` adds at the end.", 'mixing.insert(0, "milk")'),
    ANS("Copy only the egg into the savory bowl", "copy part of it", "`.copy()` copies every item.", "savory = sweet[:1]"),
    ANS("Salt the bowl on the mixer", "mixing is the copy", "`mixing` is still the sweet bowl; `savory` is the copy.", 'mixing.append("salt")'),
    ANS("Serve three bowls", "mixing is printed too", "`mixing` and `sweet` are the same bowl; the ticket prints `sweet` and `savory`.", "print(sweet, mixing, savory)"),
  ],
  spices: [
    ANS("Put salt and 3 in a sealed jar", "a tuple", "Round brackets make a tuple; `{\"salt\": 3}` makes a dict.", 'spices = ("salt", 3)'),
    ANS("Fit a drawer named 2 holding pepper", "key and value swapped", "The key goes in the brackets; the value after `=`.", 'spices[2] = "pepper"'),
    ANS("Add a spoon of salt: 4", "+= instead of -=", "`-=` takes one away.", 'spices["salt"] += 1'),
    ANS("Copy only the amount, 2", "loop over values", "`.items()` gives both the name and the amount.", "for qty in spices.values():"),
    SAY_NAME("name qty", "salt 2"),
    ANS("Copy `salt` and 2 again", "pairs repeat", "The loop moves on to the next pair: pepper.", 'name, qty = "salt", 2'),
    ANS("Shout \"pepper2\"", "no space", "`print` puts a space between values.", "print(name + str(qty))"),
    ANS("Empty every drawer", "looping clears the dict", "Looping only reads the dict.", "spices.clear()"),
  ],
  sandwich: [
    ANS("Lay them out in a different order", "lists sort themselves", "A list keeps the order you wrote.", 'stack = ["bread", "cheese", "ham", "bread"]'),
    ANS("Look at the last item instead", "index 0 is the end", "`[0]` is the first item; the last is `[-1]`.", "base = stack[-1]"),
    ANS("Swap the cheese at spot 2", "index 1 is the third item", "Counting from 0, the ham is at 1.", 'stack[2] = "tomato"'),
    ANS("Eat the whole sandwich", "pop clears the list", "`pop()` removes one item.", "stack.clear()"),
    ANS("Serve just the bottom bread", "print the first item", "`base` is one slice. The ticket prints the whole `stack`.", "print(base)"),
  ],
  cake: [
    ANS("Write a card that only ever makes 3 layers", "hard-code the answer", "The card takes any number of `layers`.", 'def cake(): return "base+layer+layer"'),
    ANS("Get a board for a 1-layer cake", "start with the base case", "The call is `cake(3)`: it starts at 3 layers.", "cake(1)"),
    ANS("Check: is it a 3-layer cake?", "compare with 3", "The ticket compares with 1.", "if layers == 3:"),
    ANS("Get a board for a 3-layer cake again", "same argument again", "The call passes `layers - 1`: 2.", "cake(layers)"),
    ANS("Check: is it a 0-layer cake?", "compare with 0", "The test is `layers == 1`.", "if layers == 0:"),
    ANS("Get a board for a 0-layer cake", "subtract 2", "`layers - 1` is 1.", "cake(layers - 2)"),
    ANS("No: 1 isn't the base case", "1 == 1 is False", "`1 == 1` is True.", "if layers != 1:"),

function reachable(st) {
  const seen = new Set();
  const visit = v => {
    if (!v || !v.r || seen.has(v.r)) return;
    seen.add(v.r);
    const o = st.heap[v.r];
    (o.items || []).forEach(it => visit(o.t === "dict" ? it[1] : it));
    (o.attrs || []).forEach(a => visit(a[1]));
  };
  st.frames.forEach(f => Object.values(f.vars).forEach(visit));
  Object.entries(st.heap).forEach(([id, o]) => { if (o.hold) visit(R(id)); });
  return seen;
}

      <rect width="56" height="56" class="wall"/><path d="M0,0.75 H56 M0,28.75 H56 M0.75,0 V28 M28.75,28 V56" class="grout"/>
    </pattern>
    <linearGradient id="brushed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color: var(--steel-hi)"/><stop offset=".25" style="stop-color: var(--steel)"/><stop offset="1" style="stop-color: var(--steel-mid)"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy="0" r="1"><stop offset="0" style="stop-color: var(--glow)"/><stop offset="1" stop-color="rgba(255,170,60,0)"/></radialGradient>
    <marker id="tie" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--twine)"/></marker>
  </defs>
  <rect width="${W}" height="${COUNTER}" fill="url(#tiles)"/>`;
  // wire racks with posts
  s += `<rect x="${SHELF_X0}" y="${SHELF_HIGH - 120}" width="8" height="${COUNTER - SHELF_HIGH + 120}" class="post"/>
        <rect x="${SHELF_X1 - 8}" y="${SHELF_HIGH - 120}" width="8" height="${COUNTER - SHELF_HIGH + 120}" class="post"/>`;
  for (const y of [SHELF_HIGH, SHELF_LOW]) {
    s += `<rect x="${SHELF_X0}" y="${y}" width="${SHELF_X1 - SHELF_X0}" height="${PLANK}" rx="2" class="rack"/>`;
    for (let wx = SHELF_X0 + 10; wx < SHELF_X1 - 4; wx += 12) s += `<line x1="${wx}" y1="${y + 2}" x2="${wx}" y2="${y + PLANK - 2}" class="wire"/>`;
  }
  s += txt(SHELF_X0 + 18, 30, "t-head", "STEEL RACK") + txt(SHELF_X0 + 18, 47, "t-py", "objects in memory (the heap)");
  // the pass with heat lamps
  const { x, y, w, h } = PASS;
  s += `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" class="pass-frame"/>
    <rect x="${x + 12}" y="${y + 12}" width="${w - 24}" height="${h - 24}" class="opening"/>
    <rect x="${x + 12}" y="${y + 12}" width="${w - 24}" height="${h - 24}" class="glow"/>
    <line x1="${x + 18}" y1="${y + 30}" x2="${x + w - 18}" y2="${y + 30}" class="rail"/>
    <rect x="${x - 14}" y="${y + h - 4}" width="${w + 28}" height="14" rx="3" class="steel"/>`;
  for (const lx of [x + 70, x + w - 70]) s += `<line x1="${lx}" y1="0" x2="${lx}" y2="${y - 6}" class="rail"/><path d="M${lx - 26},${y + 8} L${lx - 12},${y - 8} H${lx + 12} L${lx + 26},${y + 8} Z" class="lamp"/>`;
  s += `<g class="${ring ? "anim-ring" : ""}">${emoji(x + w - 26, y + h - 6, 28, "🛎️")}</g>${txt(x, y + h + 36, "t-k", "The pass")}${txt(x + 80, y + h + 36, "t-py", "print() output")}`;
  // pre-rinse tap over the dish sink
  const tx = SINK.x + SINK.w - 50;
  s += `<rect x="${tx - 6}" y="${COUNTER - 84}" width="12" height="84" class="steel"/>
    <path d="M${tx},${COUNTER - 80} q0,-26 -36,-26 q-28,0 -28,26 v18" fill="none" stroke="var(--steel-dark)" stroke-width="8" stroke-linecap="round"/>
    <rect x="${tx - 76}" y="${COUNTER - 40}" width="24" height="12" rx="4" class="steel-dark"/>`;
  // counter and under-counter doors
  s += `<rect x="0" y="${COUNTER}" width="${W}" height="${COUNTER_END - COUNTER}" class="counter-top"/>`;
  for (let ly = COUNTER + 18; ly < COUNTER_END; ly += 22) s += `<line x1="0" y1="${ly}" x2="${W}" y2="${ly}" class="brush"/>`;
  s += `<rect x="0" y="${COUNTER_END}" width="${W}" height="${EDGE}" class="counter-edge"/>
    <rect x="0" y="${COUNTER_END + EDGE}" width="${W}" height="${H - COUNTER_END - EDGE}" class="under"/>`;
  for (let k = 0; k < 6; k++) {
    const dx = 14 + k * 198;
    s += `<rect x="${dx}" y="${COUNTER_END + EDGE + 10}" width="182" height="${H - COUNTER_END - EDGE}" rx="4" class="door"/>
      <rect x="${dx + 40}" y="${COUNTER_END + EDGE + 22}" width="102" height="7" rx="3.5" class="handle"/>`;
  }
  s += txt(BOARD_X0, COUNTER + 26, "t-head", "PREP COUNTER") + txt(BOARD_X0, COUNTER + 43, "t-py", "frames (the call stack)");
  s += `<rect x="${SINK.x}" y="${SINK.y}" width="${SINK.w}" height="${SINK.h}" rx="12" class="basin"/>
    <circle cx="${SINK.x + SINK.w / 2}" cy="${SINK.y + SINK.h - 18}" r="7" class="drain"/>
    ${txt(SINK.x, SINK.y + SINK.h + 24, "t-k", "Dish sink")}${txt(SINK.x + 82, SINK.y + SINK.h + 24, "t-py", "garbage collection")}`;
  return s;
}

/* prev is the state before the step that just happened (only after a right answer); it drives the animations */
function drawKitchen(st, prev, fx) {
  const live = reachable(st), ids = Object.keys(st.heap);
  const prevLive = prev ? reachable(prev) : null;
  const changedObj = id => prev && prev.heap[id] && JSON.stringify(prev.heap[id]) !== JSON.stringify(st.heap[id]);
  const newOut = prev && st.out.length > prev.out.length;
  let s = backdrop(newOut), twine = "";
  const anchors = {};

  let x = SHELF_X0 + 22, shelfY = SHELF_LOW;
  const onShelf = ids.filter(id => live.has(id));
  if (!onShelf.length) s += txt(SHELF_X0 + 26, SHELF_LOW - 20, "t-muted", "The rack is empty");
  for (const id of onShelf) {
    const o = st.heap[id], v = vessel(o);
    const [kname, pyname] = KIND[o.t];
    const w = Math.max(v.w, Math.max((o.k || kname).length * 8.6, pyname.length * 7.9) + 10);
    if (x + w > SHELF_X1 - 14 && shelfY === SHELF_LOW && x > SHELF_X0 + 22) { x = SHELF_X0 + 22; shelfY = SHELF_HIGH; }
    const cx = x + w / 2, vx = cx - v.w / 2;
    const anim = prev && !prev.heap[id] ? "anim-drop" : changedObj(id) ? "anim-pop" : "";
    if (anim) s += `<rect x="${vx - 10}" y="${shelfY - v.h - 12}" width="${v.w + 20}" height="${v.h + 12}" rx="10" class="flash"/>`;
    s += `<g transform="translate(${vx},${shelfY})"><g class="${anim}">${v.svg}</g></g>`;
    let cy = shelfY + PLANK + 18;
    if (o.vessel === "cup") {
      const tw = o.v.length * 7.9 + 16;
      s += `<rect x="${cx - tw / 2}" y="${shelfY + 1}" width="${tw}" height="20" rx="3" class="paper"/>${txt(cx, shelfY + 16, "t-val", esc(o.v), "middle")}`;
      cy += 12;
    }
    s += txt(cx, cy, "t-k", o.k || kname, "middle") + txt(cx, cy + 16, "t-py", pyname, "middle");
    if (o.hold) { s += txt(cx, cy + 32, "t-py", "being looped over", "middle"); cy += 16; }
    anchors[id] = [cx, cy + 24];
    x += w + 34;
  }

  ids.filter(id => !live.has(id)).forEach((id, k) => {
    const v = vessel(st.heap[id]);
    const falling = prev && (!prev.heap[id] || prevLive.has(id));
    s += `<g transform="translate(${SINK.x + 30 + k * 90},${SINK.y + SINK.h - 14}) rotate(-12) scale(${Math.min(.55, 150 / v.w)})" opacity=".85"><g class="${falling ? "anim-sink" : ""}">${v.svg}</g></g>`;
  });

  const multi = st.frames.length > 1;
  const boards = st.frames.map((f, fi) => {
    const rows = Object.entries(f.vars);
    const title = fi === 0 ? "Main board" : `Cutting board ${fi}`;
    const sub = fi === 0 ? "global frame" : `frame: ${f.name}()`;
    let w = Math.max(210, title.length * 8.6 + (multi ? 96 : 30), sub.length * 7.9 + 30);
    rows.forEach(([name, v]) => {
      const left = name.startsWith("$") ? 150 : Math.max(name.length * 10.5 + 26, 76);
      w = Math.max(w, 16 + left + 22 + (v.r ? 24 : chipW(v)) + 16);
    });
    return { f, fi, rows, title, sub, w, h: 62 + Math.max(1, rows.length) * 50 };
  });
  const total = boards.reduce((a, b) => a + b.w + 34, -34);
  const sc = Math.min(1, (BOARD_X1 - BOARD_X0) / total, BOARD_MAXH / Math.max(...boards.map(b => b.h)));
  const T = (px, py) => [BOARD_X0 + (px - BOARD_X0) * sc, BOARD_Y + (py - BOARD_Y) * sc];
  const shell = (bx, by, w, h) => `<rect x="${bx + w - 6}" y="${by + h / 2 - 16}" width="28" height="32" rx="12" class="board"/>
      <circle cx="${bx + w + 10}" cy="${by + h / 2}" r="5" class="hole"/>
      <rect x="${bx}" y="${by}" width="${w}" height="${h}" rx="16" class="board"/>
      <path d="M${bx + 20},${by + h - 14} q${w / 3},-6 ${w - 40},0" class="board-grain"/>`;
  let bs = "", bx = BOARD_X0;
  const pframes = prev ? prev.frames : [];
  for (const b of boards) {
    const isActive = b.fi === st.frames.length - 1, by = BOARD_Y;
    const pf = pframes[b.fi] && pframes[b.fi].name === b.f.name ? pframes[b.fi] : null;
    const fresh = prev && b.fi >= pframes.length;
    bs += `<g class="${multi && !isActive ? "waiting" : ""}"><g class="${fresh ? "anim-slide" : ""}">${shell(bx, by, b.w, b.h)}
      ${multi && isActive ? `<rect x="${bx - 4}" y="${by - 4}" width="${b.w + 8}" height="${b.h + 8}" rx="19" class="ring"/>` : ""}
      ${txt(bx + 16, by + 24, "t-k-board", b.title)}${txt(bx + 16, by + 41, "t-py", esc(b.sub))}
      ${multi ? txt(bx + b.w - 16, by + 24, "t-k-board", isActive ? "cooking" : "waiting", "end") + txt(bx + b.w - 16, by + 41, "t-py", isActive ? "running" : "paused", "end") : ""}`;
    if (!b.rows.length) bs += txt(bx + 16, by + 82, "t-k-board", "No labels yet", "start", 'opacity=".6" font-style="italic"');
    b.rows.forEach(([name, v], ri) => {
      const ry = by + 56 + ri * 50;
      const changed = prev && (!pf || JSON.stringify(pf.vars[name]) !== JSON.stringify(v));
      if (changed) bs += `<rect x="${bx + 6}" y="${ry - 4}" width="${b.w - 12}" height="48" rx="8" class="flash"/>`;
      bs += `<g class="${changed ? "anim-slap" : ""}">`;
      if (name === "$ret") {
        bs += `<ellipse cx="${bx + 38}" cy="${ry + 20}" rx="24" ry="10" class="china"/><ellipse cx="${bx + 38}" cy="${ry + 19}" rx="15" ry="5.5" fill="none" stroke="var(--china-edge)" stroke-width="1.5"/>
          ${txt(bx + 70, ry + 16, "t-k-board", "Plate")}${txt(bx + 70, ry + 33, "t-py", "return value")}`;
      } else if (name === "$err") {
        bs += `<rect x="${bx + 10}" y="${ry - 2}" width="${b.w - 20}" height="44" rx="8" class="alarm"/>${emoji(bx + 32, ry + 28, 22, "🚨")}
          ${txt(bx + 52, ry + 16, "t-white", "Alarm!")}${txt(bx + 52, ry + 33, "t-white", "exception raised", "start", 'font-size="11"')}
          ${txt(bx + b.w - 24, ry + 26, "t-white", esc(v.p), "end")}</g>`;
        return;
      } else {
        bs += `<g transform="rotate(-1.5 ${bx + 16} ${ry})"><rect x="${bx + 16}" y="${ry}" width="${name.length * 10.5 + 22}" height="28" class="tape"/>
          ${txt(bx + 27, ry + 21, "t-hand", esc(name))}</g>${txt(bx + 18, ry + 42, "t-py", "variable")}`;
      }
      const xr = bx + b.w - 16, cy = ry + 16;
      if (v.r) {
        bs += `<circle cx="${xr - 9}" cy="${cy}" r="8" class="knot"/>`;
        if (anchors[v.r]) {
          const [kx, ky] = T(xr - 9, cy), [ax, ay] = anchors[v.r], dy = Math.max(40, (ky - ay) / 2);
          const d = `M${kx},${ky} C${kx},${ky - dy} ${ax},${ay + dy} ${ax},${ay + 3}`;
          twine += `<path d="${d}" class="twine${changed ? " new" : ""}" marker-end="url(#tie)"/>`;
          if (changed) twine += `<circle r="7" class="knot-run"><animateMotion dur=".7s" fill="freeze" path="${d}"/></circle>`;
        }
      } else bs += chipSVG(xr, cy, v);
      bs += `</g>`;
    });
    bs += `</g></g>`;
    bx += b.w + 34;
  }
  // boards that were just put away slide off the counter
  pframes.slice(st.frames.length).forEach((f, k) => {
    bs += `<g class="anim-out">${shell(bx, BOARD_Y, 210, 112)}${txt(bx + 16, BOARD_Y + 24, "t-k-board", `Cutting board ${st.frames.length + k}`)}
      ${txt(bx + 16, BOARD_Y + 41, "t-py", `frame: ${esc(f.name)}() ends`)}${emoji(bx + 105, BOARD_Y + 88, 34, "💨")}</g>`;
    bx += 244;
  });
  s += `<g transform="translate(${BOARD_X0} ${BOARD_Y}) scale(${sc}) translate(${-BOARD_X0} ${-BOARD_Y})">${bs}</g>`;

  const { x: hx, y: hy, w: hw, h: hh } = PASS;
  if (!st.out.length) s += txt(hx + hw / 2, hy + hh / 2 + 10, "t-open", "Nothing at the pass yet", "middle");
  let ty = hy + 38;
  st.out.forEach((line, n) => {
    const chunks = line.match(/.{1,26}(\s|$)|.{1,26}/g).map(c => c.trimEnd());
    const th = 30 + chunks.length * 17, fresh = prev && n >= prev.out.length;
    s += `<g class="${fresh ? "anim-ticket" : ""}">${fresh ? `<rect x="${hx + 22}" y="${ty - 4}" width="${hw - 44}" height="${th + 8}" rx="6" class="flash"/>` : ""}
      <rect x="${hx + 28}" y="${ty}" width="${hw - 56}" height="${th}" class="paper" transform="rotate(${n % 2 ? 1.2 : -1.2} ${hx + hw / 2} ${ty})"/>
      <rect x="${hx + hw / 2 - 12}" y="${ty - 8}" width="24" height="12" rx="2" class="steel"/>
      ${txt(hx + 40, ty + 18, "t-tiny", `SERVED · LINE ${n + 1}`)}
      ${chunks.map((c, k) => txt(hx + 40, ty + 36 + k * 17, "t-ticket", esc(c))).join("")}</g>`;
    ty += th + 14;
  });
  return s + twine + chefSVG(fx);
}

/* the cartoon chef who reacts to every answer */
let chefSeed = 0;
function chefSVG(fx) {
  if (!fx) return "";
  chefSeed += 1;
  const lines = fx === "right" ? ["Yes, chef!", "Perfect!", "Nailed it!", "Delicious!", "Order up!", "Chef's kiss!"]
                               : ["Oops!", "Not quite, chef!", "That's burnt!", "Hmm, try again!", "Back to the pan!"];
  const say = lines[chefSeed % lines.length], bw = say.length * 10.5 + 34;
  const bits = (fx === "right" ? [[-80, -150, "✨"], [70, -160, "✨"], [-10, -190, "⭐"], [-120, -100, "✨"]]
                               : [[-60, -150, "💨"], [50, -160, "💨"], [-5, -185, "💢"]])
    .map(([dx, dy, e], k) => `<text x="0" y="-60" class="emoji bit" font-size="28" text-anchor="middle" style="--dx:${dx}px;--dy:${dy + 60}px;animation-delay:${.3 + k * .07}s">${e}</text>`).join("");
  return `<g transform="translate(1112 788)"><g class="chef chef-${fx}">${bits}
    <g class="bubble"><path d="M${-62 - bw},-150 h${bw} a22,22 0 0 1 0,44 h${-bw + 30} l-16,14 l2,-14 h-16 a22,22 0 0 1 0,-44 z" class="bubble-bg"/>
      ${txt(-62 - bw / 2, -121, "t-bubble", say, "middle")}</g>
    <g class="chef-face">${emoji(0, 0, 104, "🧑‍🍳")}</g></g></g>`;
}

/* ------------------------------------------------------------------ game */

function highlight(src) {
  const re = /("[^"]*"|'[^']*')|\b(def|class|return|if|for|in|while|else|elif|try|except)\b|\b(\d+)\b|\b(print|len|range)\b/g;
  let out = "", last = 0, m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index));
    out += `<span class="${m[1] ? "st" : m[2] ? "kw" : m[3] ? "nu" : "bi"}">${esc(m[0])}</span>`;
    last = re.lastIndex;
  }
  return out + esc(src.slice(last));
}

const load = () => { try { return JSON.parse(localStorage.getItem("pk-best") || "{}"); } catch (e) { return {}; } };
let best = load();
const save = () => { try { localStorage.setItem("pk-best", JSON.stringify(best)); } catch (e) {} };

let flipped = new Set(), fx = null, D = null, i = 0, mistakes = 0, order = [], wrongPicked = new Set(), hinted = false, orderNo = 40;
const starsFor = m => m === 0 ? 3 : m <= 2 ? 2 : 1;
const starRow = n => "★★★".split("").map((c, k) => `<span class="${k < n ? "" : "off"}">⭐</span>`).join("");

function shuffle(n) { const a = [...Array(n).keys()]; for (let k = n - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [a[k], a[j]] = [a[j], a[k]]; } return a; }

function enterStep() {
  wrongPicked = new Set(); hinted = false; flipped = new Set();
  const next = D.steps[i + 1];
  order = next ? shuffle(next.wrong.length + 1) : [];
}

function printTicket() {
  orderNo += 1;
  $("#order-no").textContent = `#${orderNo}`;
  const lvl = "●".repeat(D.tier) + "○".repeat(5 - D.tier);
  $("#ticket").innerHTML = `<div class="th"><span>Order #${orderNo}</span><span>Table ${1 + (orderNo % 9)}</span><span>${lvl}</span></div>
    <div class="dish">${D.pic} ${esc(D.name)}</div>
    ${(() => { const need = [...(NEEDS[D.id] || []), ...BASICS]; return `<details class="needs" open>
      <summary>You'll need <span>(${need.length})</span></summary>
      <ul>${need.map(([e, k, py]) => `<li><span class="ne">${e}</span><span class="term"><span class="tk">${esc(k)}</span><span class="tp">${esc(py)}</span></span></li>`).join("")}</ul>
    </details>`; })()}
    <ol id="lines">${D.code.map((src, n) =>
      `<li class="cl printing" data-n="${n + 1}" style="animation-delay:${n * 0.14}s"><span class="ln">${n + 1}</span><span class="src">${highlight(src) || " "}</span>${src.trim()
        ? `<button type="button" class="peek" data-n="${n + 1}" aria-expanded="false" aria-label="Break down line ${n + 1} word by word" title="Break this line down">🔍</button>` : ""}</li>`).join("")}</ol>
    <div class="foot"><span>${esc(D.topics)}</span><span>${D.steps.length - 1} steps</span></div>`;
  openLine = null;
  $("#lines").addEventListener("click", e => {
    const b = e.target.closest(".peek");
    if (b) { openLine = openLine === +b.dataset.n ? null : +b.dataset.n; showBreakdown(); }
    if (e.target.closest(".bd-close")) { openLine = null; showBreakdown(); }
  });
}

/* ------------------------------------------------------------------ line breakdown */

let openLine = null;

const KW = {
  def:    ["keyword: def", "Starts a function definition: `def name(parameters):`. The indented lines below are the body, which only runs when the function is called.", "Writing a new recipe card."],
  class:  ["keyword: class", "Starts a class: a blueprint for making objects. The indented `def`s inside become its methods.", "Pinning up a blueprint for a kind of appliance."],
  return: ["keyword: return", "Ends the function and hands the value after it back to whoever called the function.", "Putting the finished food on the plate to hand back."],
  if:     ["keyword: if", "Starts a condition. The indented block below runs only when the test after `if` is True.", "Checking the order before choosing a path."],
  else:   ["keyword: else", "The fallback block. It runs only when the `if` test was False.", "The other path, used when the check fails."],
  for:    ["keyword: for", "Starts a loop that takes each item from a collection in turn and binds it to the loop variable.", "Picking ingredients off the tray one at a time."],
  in:     ["keyword: in", "In a `for` loop, separates the loop variable from the collection being looped over.", "Which tray to take the items from."],
  while:  ["keyword: while", "Starts a loop that repeats its block for as long as the test is True, re-checking before every pass.", "Keep heating while the thermometer is below the mark."],
  try:    ["keyword: try", "Starts a block that Python attempts while watching for errors.", "Putting on oven mitts before a risky step."],
  except: ["keyword: except", "Names the error type to catch. If that error happens inside `try`, this block runs instead of the program crashing.", "The backup plan for when the alarm goes off."],
};
const BUILTIN = {
  print: ["built-in function: print", "Shows values as output. Several values are separated by spaces, and strings appear without their quotes.", "Calling the dish out at the pass."],
  len:   ["built-in function: len", "Returns how many items a collection holds.", "Counting what's in the bowl."],
};
const METHOD = {
  append: ["list method: append", "Adds one item to the end of the list. It changes the existing list in place and makes no copy.", "Pouring one more ingredient into the same bowl."],
  pop:    ["list method: pop", "Removes an item and hands it back. With no argument it takes the last item.", "Lifting the top item off the plate."],
  heat:   ["method: heat", "A function defined in the class. Called as `oven.heat(20)`, Python passes `oven` in as `self`.", "Pressing this oven's heat button."],
  copy:   ["method: copy", "Builds a new list (or dict) holding the same items. Later changes to one don't affect the other.", "Getting a second bowl and filling it the same way."],
  items:  ["dict method: items", "Gives the dict's (key, value) pairs, one per entry, in insertion order.", "Walking along the drawers, reading each name and amount."],
};

function tokenize(src) {
  const out = [], indent = src.match(/^ */)[0];
  if (indent) out.push({ t: indent, k: "indent" });
  const re = /("[^"]*"|'[^']*')|(\d+)|([A-Za-z_]\w*)|(\+=|-=|==|!=|<=|>=|[=+\-*\/<>])|([()\[\]{}:,.])|(\s+)/y;
  re.lastIndex = indent.length;
  let m;
  while (re.lastIndex < src.length && (m = re.exec(src))) {
    if (m[6]) continue;
    out.push({ t: m[0], k: m[1] ? "str" : m[2] ? "num" : m[3] ? "id" : m[4] ? "op" : "punc" });
  }
  return out;
}

const inClass = src => /^\s+def /.test(src) && D && D.code.some(l => /^class /.test(l));
function explainTokens(src) {
  const toks = tokenize(src);
  const first = toks.findIndex(x => x.k !== "indent");
  const hasAssign = toks.some(x => ["=", "+=", "-="].includes(x.t));
  const assignAt = toks.findIndex(x => ["=", "+=", "-="].includes(x.t));
  let inParams = false, afterFor = false, depth = 0;
  toks.forEach((x, j) => {
    const p = toks[j - 1], n = toks[j + 1];
    const set = (cat, role, py, kit) => Object.assign(x, { cat, role, py, kit });
    if (x.k === "indent") return set("ws", `indentation (${x.t.length} spaces)`, "Marks this line as part of the block above it (the `def`, `if`, `for`, `while` or `try`). Python uses indentation instead of braces to group lines.", "Sub-steps written under a heading in the recipe.");
    if (x.k === "str") {
      const ing = INGREDIENT[x.t.replace(/"/g, "'")];
      return set("lit", "string literal (str)", `Text written directly in the code. The quotes mark where the text starts and ends; they aren't part of the value, which is ${x.t.slice(1, -1) ? `the text ${x.t.slice(1, -1)}` : "empty text"}.`,
        ing ? `The ingredient itself, ${ing} ${x.t.slice(1, -1)}.` : "Words written out exactly, like a strip of text on the ticket.");
    }
    if (x.k === "num") return set("lit", "integer literal (int)", `The whole number ${x.t}, written directly in the code.`, `A fixed amount written on the ticket: ${x.t}.`);
    if (x.k === "id") {
      if (KW[x.t]) {
        if (x.t === "for") afterFor = true;
        if (x.t === "in") afterFor = false;
        return set("kw", ...KW[x.t]);
      }
      if (p && p.t === "def" && x.t === "__init__") return set("name", "special method: __init__", "Runs automatically when a new object is built, to set it up. It always receives the new object as `self`.", "The setup instructions on the blueprint, followed for every new oven.");
      if (p && p.t === "def" && inClass(src)) return set("name", "method name (being defined)", `A function that belongs to the class. Every object built from it can use it as \`object.${x.t}(...)\`.`, "A button on every oven built from this blueprint.");
      if (inParams && x.t === "self") return set("name", "parameter: self", "The first parameter of a method. It receives the object the method was called on, automatically.", "\"This very oven\": whichever appliance pressed the button.");
      if (p && p.t === "def") return set("name", "function name (being defined)", `The name the new function will be stored under. Later, \`${x.t}(...)\` runs it.`, "The title on the recipe card, which is also its label on the rack.");
      if (inParams) return set("name", "parameter", `A name the function receives. Each call fills it with the argument passed in, inside that call's own frame.`, "The ingredient slot on the recipe card, filled in when an order comes.");
      if (afterFor) return set("name", "loop variable", `Re-bound to the next item on every pass of the loop. After the loop ends it keeps the last item.`, "A label moved onto each ingredient as you pick it up.");
      if (x.t === "self") return set("name", "self", "The object this method is working on. Python fills it in automatically: in `oven.heat(20)`, `self` is `oven`.", "\"This very oven\": the appliance the board is working on.");
      if (p && p.t === "def" && x.t === "__init__") return set("name", "special method: __init__", "Runs automatically when a new object is built, to set it up. It always receives the new object as `self`.", "The setup instructions on the blueprint, followed for every new oven.");
      if (p && p.t === "class") return set("name", "class name", "The name of the new blueprint. Class names start with a capital letter by convention.", "The title on the blueprint.");
      if (p && p.t === "." && !(n && n.t === "(")) return set("name", "attribute", `A value stored on the object before the dot. \`${x.t}\` belongs to that particular object.`, "A dial or setting on that particular appliance.");
      if (p && p.t === ".") return set("call", ...(METHOD[x.t] || [`method: ${x.t}`, "A function that belongs to the object before the dot.", "A tool that belongs to that container."]));
      if (BUILTIN[x.t]) return set("call", ...BUILTIN[x.t]);
      if (x.t === "KeyError") return set("name", "exception type: KeyError", "The error Python raises when you look up a dict key that doesn't exist.", "The alarm for a missing drawer.");
      if (n && n.t === "(" && /^[A-Z]/.test(x.t)) return set("call", "class call (build an object)", `Calling the class \`${x.t}\` builds a new object from it and runs its \`__init__\`.`, "Building a new appliance from the blueprint.");
      if (n && n.t === "(") return set("call", "function call", `Runs the function \`${x.t}\`. A fresh frame is created for this call.`, `Using the ${x.t} recipe card: a fresh cutting board comes out.`);
      if (j === first && n && n.t === "=") return set("name", "variable (being assigned)", `The name on the left of \`=\`. It gets tied to whatever the right side produces. If it already existed, it's moved to the new object.`, "Writing a masking-tape label and tying it to the result.");
      if (j === first && n && (n.t === "+=" || n.t === "-=")) return set("name", "variable (being updated)", "This name is read, combined with the right side, and then re-bound to the result.", "The scale or label whose reading is about to change.");
      if (j === first && n && n.t === "[" && hasAssign) return set("name", "container (being changed)", "The dict or list whose entry is about to be set or updated.", "The cabinet whose drawer you're about to open.");
      if (n && n.t === ".") return set("name", "variable (object used)", `Python follows \`${x.t}\` to its object, then uses the method after the dot on that object.`, "Following the label's twine to the container you'll work with.");
      return set("name", "variable (being read)", `Python looks up \`${x.t}\` and follows its reference to the object it points to.`, "Reading a label and following its twine to the container on the rack.");
    }
    if (x.k === "op") {
      const strNear = (p && p.k === "str") || (n && n.k === "str") || (toks.slice(j + 1).some(y => y.k === "str") && x.t === "+" && p && p.t === ")");
      const ops = {
        "=":  ["assignment operator", "Works out the right side first, then binds the name on the left to the result. It never copies the object.", "Tying a label to something with twine."],
        "==": ["comparison: equal to", "Asks whether the two sides are equal and gives True or False. One `=` assigns; two `==` compare.", "Checking whether the order matches."],
        ">":  ["comparison: greater than", "Gives True if the left side is bigger than the right, otherwise False.", "Reading the timer against the mark."],
        "<":  ["comparison: less than", "Gives True if the left side is smaller than the right. Equal values give False.", "Checking the thermometer is still below the mark."],
        "+":  strNear ? ["operator: + (join)", "With strings, `+` joins them end to end into a brand-new string.", "Sticking two word strips together."]
                      : ["operator: + (add)", "Adds two numbers and produces a new number.", "Adding amounts together."],
        "-":  ["operator: - (subtract)", "Subtracts the right side from the left, producing a new number.", "Taking some away."],
        "*":  ["operator: * (multiply)", "Multiplies two numbers, producing a new number.", "Scaling the amount up."],
        "+=": ["augmented assignment: +=", "`x += y` is short for `x = x + y`. The name is re-bound to the new total.", "Adding to the running total on the scale."],
        "-=": ["augmented assignment: -=", "`x -= y` is short for `x = x - y`.", "Taking some out and writing down the new amount."],
      };
      return set("op", ...(ops[x.t] || [`operator ${x.t}`, "An operator.", "A kitchen action."]));
    }
    // punctuation
    if (x.t === ")" || x.t === "]" || x.t === "}") {
      if (x.t === ")") inParams = false;
      if (x.t === "}") depth -= 1;
      return set("hide");
    }
    if (x.t === "(") {
      if (toks[j - 2] && toks[j - 2].t === "def") { inParams = true; return set("punc", "parentheses: parameter list", "Lists the names the function expects, up to the matching `)`.", "The ingredients the recipe card asks for."); }
      if (p && p.k === "id" && !KW[p.t]) return set("punc", "parentheses: call", "Runs the function now, passing it whatever is inside, up to the matching `)`.", "Starting the recipe with these ingredients.");
      return set("punc", "parentheses: grouping", "Groups part of an expression so it's worked out first.", "Doing this part first.");
    }
    if (x.t === "[") {
      if (p && ((p.k === "id" && !KW[p.t]) || p.t === ")")) return hasAssign && j < assignAt
        ? set("punc", "square brackets: key to change", "Chooses which key (in a dict) or position (in a list) to store into, up to the matching `]`.", "Picking which drawer to open.")
        : set("punc", "square brackets: lookup", "Gets the item stored under this key or position. A missing dict key raises KeyError.", "Opening the drawer with this name.");
      return set("punc", "square brackets: list literal", "Builds a new list from the items inside, separated by commas, up to the matching `]`.", "A mixing bowl or tray holding these items in order.");
    }
    if (x.t === "{") { depth += 1; return set("punc", "curly braces: dict literal", "Builds a new dictionary of `key: value` pairs, up to the matching `}`.", "A spice cabinet or fridge with named drawers."); }
    if (x.t === ":") return depth > 0
      ? set("punc", "colon: key → value", "Inside a dict, separates a key from its value.", "Drawer name on the front, amount inside.")
      : set("punc", "colon: start of a block", "Ends this header line. The indented lines below belong to it.", "\"…then do these sub-steps:\"");
    if (x.t === ",") return afterFor
      ? set("punc", "comma: unpacking", "Separates two loop variables. Each item (a pair) is split across them.", "Copying a drawer's name and amount onto two labels.")
      : set("punc", "comma: separator", "Separates items, arguments or values.", "\"and\" between ingredients.");
    if (x.t === ".") return set("punc", "dot: attribute access", "Reaches into the object on the left to use something that belongs to it, here a method.", "Using a tool that belongs to that container.");
    return set("punc", `punctuation ${x.t}`, "", "");
  });
  return toks.filter(x => x.cat !== "hide");
}

const PATTERNS = [
  [/^\s*class /, "class Name:", "Define a blueprint for objects. The indented methods below belong to it."],
  [/^\s*\w+\.\w+\s*(=|\+=)/, "object.attribute = value", "Store or update a value on that object."],
  [/^\s*def /, "def name(parameters):", "Define a new function. Nothing inside it runs until it's called."],
  [/^\s*return /, "return value", "Finish the function and hand this value back to the caller."],
  [/^\s*if /, "if condition:", "Run the indented block below only when the condition is True."],
  [/^\s*else:/, "else:", "Run the indented block below only when the if condition was False."],
  [/^\s*for /, "for name in collection:", "Run the indented block once per item, binding the name to each item in turn."],
  [/^\s*while /, "while condition:", "Keep running the indented block for as long as the condition stays True."],
  [/^\s*try:/, "try:", "Attempt the indented block while watching for errors."],
  [/^\s*except/, "except ErrorType:", "If that kind of error happened in the try block, run this block instead of crashing."],
  [/^\s*print\(/, "print(value, ...)", "Show the values as output, separated by spaces."],
  [/\[[^\]]*\]\s*(=|\+=|-=)/, "container[key] = value", "Store a value in the dict or list at that key or position."],
  [/^\s*\w+\s*(\+=|-=)/, "name += value", "Update a name with a new value worked out from its old one."],
  [/^\s*[\w, ]+\s=\s/, "name = expression", "Work out the right side first, then tie the name on the left to the result."],
  [/^\s*\w+\.\w+\(/, "object.method(arguments)", "Ask an object to do something to itself."],
];

function breakdownHTML(n) {
  const src = D.code[n - 1];
  const toks = explainTokens(src);
  const pat = PATTERNS.find(([re]) => re.test(src));
  const runs = D.steps.map((s, idx) => ({ s, idx })).filter(x => x.idx > 0 && (x.s.line === n || (x.s.also || []).includes(n)));
  const done = runs.filter(x => x.idx <= i);
  const show = (done[0] || runs[0]);
  let kitchen;
  if (!runs.length) kitchen = `<p class="bd-note">This line doesn't run in this dish. Python skips it because of the path the program takes (for example, an <code>else</code> block after an <code>if</code> that was True).</p>`;
  else {
    const body = `<p><b>${code(show.s.right[0])}</b></p><p class="bd-py">${code(show.s.right[1])}</p>
      ${runs.length > 1 ? `<p class="bd-note">This line runs ${runs.length} times in this dish${done.length ? `; you've cooked it ${done.length} ${done.length === 1 ? "time" : "times"} so far` : ""}.</p>` : ""}`;
    kitchen = done.length ? body : `<details><summary>Show the kitchen step (you haven't cooked this line yet)</summary>${body}</details>`;
  }
  return `<div class="bd">
    <div class="bd-head"><span><b>Line ${n}, word by word</b></span><button type="button" class="bd-close" aria-label="Close breakdown">Close</button></div>
    ${pat ? `<div class="bd-pat"><span class="bd-lbl">Pattern</span><code>${esc(pat[1])}</code><p>${esc(pat[2])}</p></div>` : ""}
    <div class="bd-strip">${toks.map((x, k) => `<span class="tok c-${x.cat}"><i>${k + 1}</i>${x.k === "indent" ? "␣".repeat(x.t.length) : esc(x.t)}</span>`).join("")}</div>
    <ol class="bd-list">${toks.map((x, k) => `<li>
      <span class="tok c-${x.cat}"><i>${k + 1}</i>${x.k === "indent" ? "␣".repeat(x.t.length) : esc(x.t)}</span>
      <div><b class="bd-role">${esc(x.role)}</b><p>${code(x.py)}</p><p class="bd-kit">🍳 ${esc(x.kit)}</p></div></li>`).join("")}</ol>
    <div class="bd-kitchen"><span class="bd-lbl">The kitchen step for this line</span>${kitchen}</div>
  </div>`;
}

function showBreakdown() {
  document.querySelectorAll("#lines .bd-row").forEach(r => r.remove());
  document.querySelectorAll("#lines .peek").forEach(b => b.setAttribute("aria-expanded", +b.dataset.n === openLine));
  if (!openLine) return;
  const li = document.querySelector(`#lines li.cl[data-n="${openLine}"]`);
  li.insertAdjacentHTML("afterend", `<li class="bd-row">${breakdownHTML(openLine)}</li>`);
}

/* code lines in the answer comparison, with words that differ from the ticket marked */
const lexLine = s => s.match(/"[^"]*"|'[^']*'|#.*$|\w+|\s+|[^\s\w]/g) || [];
const PYKW = new Set(["class", "self", "def", "return", "if", "else", "for", "in", "while", "try", "except", "del", "global", "pass", "break", "raise", "True", "False", "None"]);
function tokClass(t) {
  if (t[0] === "#") return "cm";
  if (t[0] === '"' || t[0] === "'") return "st";
  if (/^\d+$/.test(t)) return "nu";
  if (PYKW.has(t)) return "kw";
  if (/^(print|len|repr|sorted)$/.test(t)) return "bi";
  return "";
}
function diffHTML(a, b) {
  const A = lexLine(a), B = lexLine(b).filter(t => t.trim());
  const As = A.map((t, k) => ({ t, k })).filter(x => x.t.trim());
  const n = As.length, m = B.length;
  const L = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
  for (let x = n - 1; x >= 0; x--) for (let y = m - 1; y >= 0; y--)
    L[x][y] = As[x].t === B[y] ? L[x + 1][y + 1] + 1 : Math.max(L[x + 1][y], L[x][y + 1]);
  const same = new Set();
  for (let x = 0, y = 0; x < n && y < m;) {
    if (As[x].t === B[y]) { same.add(As[x].k); x++; y++; }
    else if (L[x + 1][y] >= L[x][y + 1]) x++; else y++;
  }
  return A.map((t, k) => t.trim() ? `<span class="${same.has(k) ? "" : "dif "}${tokClass(t)}">${esc(t)}</span>` : esc(t)).join("");
}

function render() {
  const cur = D.steps[i], next = D.steps[i + 1], prev = fx === "right" && i > 0 ? D.steps[i - 1].st : null;
  document.querySelectorAll("#lines li.cl").forEach(li => li.classList.toggle("next", !!next && next.line === +li.dataset.n));
  showBreakdown();
  $("#kitchen").innerHTML = drawKitchen(cur.st, prev, fx);
  if (fx === "wrong") { const sw = $(".scene-wrap"); sw.classList.remove("shake"); void sw.offsetWidth; sw.classList.add("shake"); }
  fx = null;

  const last = i > 0 ? `<div class="fb ok"><span class="lbl">✓ Right. Here's what happened</span>
      <code class="line">${diffHTML(D.code[cur.line - 1].trim(), D.code[cur.line - 1].trim())}</code><p>${code(cur.py)}</p></div>
      <div class="fb k"><span class="lbl">In the kitchen</span><p>${fmt(cur.k)}</p></div>` : "";

  if (!next) {
    const stars = starsFor(mistakes);
    $("#move").innerHTML = `<div class="done">
      <h2>Order up! ${D.pic} ${esc(D.name)} is served</h2>
      <div class="stars" aria-label="${stars} of 3 stars">${starRow(stars)}</div>
      <p>${mistakes === 0 ? "A perfect service, with no wrong steps." : `${mistakes} wrong ${mistakes === 1 ? "step" : "steps"} along the way.`} You practised <b>${esc(D.topics)}</b>.</p>
      <div class="row"><button class="primary" type="button" id="b-book">Choose the next dish</button><button type="button" id="b-again">Cook it again</button></div>
    </div>${last}`;
    $("#b-book").onclick = openBook;
    $("#b-again").onclick = () => startDish(D.id);
    return;
  }

  const lineSrc = D.code[next.line - 1].trim();
  const opts = [{ k: next.right[0], p: next.right[1], ok: true, c: lineSrc }, ...next.wrong.map(([k, p, why, c]) => ({ k, p, why, c }))];
  $("#move").innerHTML = `<div class="q"><div>${term(i === 0 ? "Your first move" : "Your next move", "which step does Python take?")}
      <h2 style="margin-top:6px">Line ${next.line}: <code style="font: 600 15px var(--mono)">${esc(lineSrc)}</code></h2></div>
      <div class="stat">step ${i + 1}/${D.steps.length - 1}<br>${mistakes} wrong</div></div>
    <div class="opts">${order.map(k => {
      const o = opts[k], wrong = wrongPicked.has(k);
      return `<div class="opt-card ${flipped.has(k) ? "flipped" : ""}">
        <button type="button" class="opt ${wrong ? "wrong" : ""} ${hinted && o.ok ? "hint" : ""}" data-k="${k}" ${wrong ? "disabled" : ""}>
        <span class="face front"><span>${code(o.k)}</span><span class="op">${esc(o.p)}</span>${wrong ? `
        <span class="cmp"><span class="cmp-l">Your answer as code</span><code class="line bad">${diffHTML(o.c, lineSrc)}</code>
        <span class="cmp-l">The ticket says</span><code class="line">${diffHTML(lineSrc, lineSrc)}</code></span>
        <span class="why">✗ ${code(o.why)}</span>` : ""}</span>
        <span class="face back"><span class="cmp-l">This answer as code</span><code class="line">${diffHTML(o.c, o.c)}</code>
          <span class="op">${esc(o.p)}</span>${wrong ? `<span class="why">✗ already tried</span>` : `<span class="tap">Tap the card to pick this answer</span>`}</span>
        </button>
        <button type="button" class="flip" data-flip="${k}" aria-pressed="${flipped.has(k)}" aria-label="Flip the card to see this answer as code" title="Flip: see this answer as code">&lt;/&gt;</button>
      </div>`;
    }).join("")}</div>
    <div class="tools"><button type="button" id="b-hint">Show me the right step</button><button type="button" id="b-restart">Restart dish</button></div>
    ${last || `<div class="fb k" style="margin-top:12px"><span class="lbl">In the kitchen</span><p>${fmt("The printer just printed your order [ticket|code]. Read the highlighted line and pick what the kitchen does first.")}</p></div>`}`;

  $("#move").querySelectorAll(".opt").forEach(btn => btn.onclick = () => {
    const k = +btn.dataset.k;
    if (opts[k].ok) { i += 1; fx = "right"; enterStep(); render(); return; }
    if (!wrongPicked.has(k)) { wrongPicked.add(k); mistakes += 1; }
    flipped.delete(k); // show the front, where the comparison and the reason are
    fx = "wrong";
    render();
    const again = $(`#move .opt[data-k="${k}"]`);
    if (again) again.closest(".opt-card").classList.add("shake");
  });
  $("#move").querySelectorAll(".flip").forEach(btn => btn.onclick = () => {
    const k = +btn.dataset.flip, card = btn.closest(".opt-card");
    if (flipped.has(k)) flipped.delete(k); else flipped.add(k);
    card.classList.toggle("flipped", flipped.has(k));
    btn.setAttribute("aria-pressed", flipped.has(k));
  });
  $("#b-hint").onclick = () => { if (!hinted) { hinted = true; mistakes += 1; } render(); };
  $("#b-restart").onclick = () => startDish(D.id);
}

function startDish(id) {
  D = DISHES.find(d => d.id === id) || DISHES[0];
  i = 0; mistakes = 0;
  try { localStorage.setItem("pk-dish", D.id); } catch (e) {}
  printTicket();
  enterStep();
  render();
  closeBook();
}

/* rating is recorded when the last step is reached */
const _render = render;
render = function () {
  _render();
  if (D && !D.steps[i + 1]) {
    const stars = starsFor(mistakes);
    if (!best[D.id] || best[D.id] < stars) { best[D.id] = stars; save(); }
  }
};

function renderBook() {
  const tierHTML = ([lvl, name, py]) => `<div class="tier"><h3><span class="lvl">${"●".repeat(lvl)}${"○".repeat(5 - lvl)}</span>${term(name, py)}</h3>
    ${DISHES.filter(d => d.tier === lvl).map(d => `<button type="button" class="dish-btn" data-id="${d.id}">
      <span class="pic">${d.pic}</span><span class="info"><span class="name">${esc(d.name)}</span><span class="topics">${esc(d.topics)}</span></span>
      <span class="best">${best[d.id] ? "⭐".repeat(best[d.id]) : "Not cooked yet"}</span></button>`).join("")}</div>`;
  $("#pages").innerHTML = `<div class="page">${TIERS.slice(0, 3).map(tierHTML).join("")}</div><div class="page">${TIERS.slice(3).map(tierHTML).join("")}</div>`;
  $("#pages").querySelectorAll(".dish-btn").forEach(b => b.onclick = () => startDish(b.dataset.id));
}
function openBook() { renderBook(); $("#book").hidden = false; $("#close-book").hidden = !D; }
function closeBook() { $("#book").hidden = true; }

$("#open-book").onclick = openBook;
$("#close-book").onclick = closeBook;
$("#book").addEventListener("click", e => { if (e.target.id === "book" && D) closeBook(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && D) closeBook(); });

let first = location.hash.slice(1);
if (DISHES.some(d => d.id === first)) startDish(first);
else {
  let last = ""; try { last = localStorage.getItem("pk-dish") || ""; } catch (e) {}
  startDish(DISHES.some(d => d.id === last) ? last : "toast");
  openBook();
}
</script>
